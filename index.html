const SAVE_KEY = 'starhat_wizard_td_v1';
const defSave = () => ({
  cleared: 0, stars: {}, gold: 0, muted: false, musicOff: false,
  upgrades: { wall: 0, crystal: 0, spring: 0, owl: 0, thorns: 0, staff: 0 },
  ranks: {}, loadout: [], seen: {},
});
let save = defSave();
// 把讀到的存檔（本機或雲端）套用成目前進度；t 是最後存檔時間，用來判斷哪份比較新
function applySave(s) {
  if (!s || typeof s.cleared !== 'number') return false;
  save = Object.assign(defSave(), s);
  save.upgrades = Object.assign(defSave().upgrades, s.upgrades || {});
  save.stars = Object.assign({}, s.stars); save.ranks = Object.assign({}, s.ranks); save.seen = Object.assign({}, s.seen);
  // 已刪除的魔法：投入的技能點自動退回，空出來的出戰欄位自動補上
  for (const k of Object.keys(save.ranks)) if (!SPELL[k]) delete save.ranks[k];
  const needFill = !Array.isArray(s.loadout) || s.loadout.some(id => !SPELL[id]);
  save.loadout = Array.isArray(s.loadout) ? [...s.loadout] : [];
  normalizeLoadout(needFill);
  return true;
}
try { applySave(JSON.parse(localStorage.getItem(SAVE_KEY))); } catch (e) {}
normalizeLoadout(!save.loadout.length);
function writeSave() {
  save.t = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
  scheduleCloud();
}

// 雲端存檔：在 claude.ai 開啟時，每位玩家在 data/users/<id>/save 各存一份（別人看不到），電腦和手機共用
const Cloud = { ref: null, busy: false, pending: false, timer: 0 };
async function initCloud() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc('data/users/' + uid + '/save');
    const snap = await ref.get();
    const remote = snap.exists ? snap.data() : null;
    Cloud.ref = ref;
    if (remote && (remote.t || 0) > (save.t || 0) && applySave(remote)) {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
      showToast('已載入雲端存檔（第 ' + save.cleared + ' 關）');
    } else if (save.t) cloudWrite();
  } catch (e) { Cloud.ref = null; }
}
function scheduleCloud() {
  if (!Cloud.ref) return;
  clearTimeout(Cloud.timer);
  Cloud.timer = setTimeout(cloudWrite, 1200);
}
async function cloudWrite() {
  if (!Cloud.ref) return;
  if (Cloud.busy) { Cloud.pending = true; return; }
  Cloud.busy = true;
  try { await Cloud.ref.set(JSON.parse(JSON.stringify(save))); }
  catch (e) { if (!e || e.code !== 'unavailable') Cloud.ref = null; }
  Cloud.busy = false;
  if (Cloud.pending) { Cloud.pending = false; cloudWrite(); }
}

// ---------- 存檔檔案：把進度存成 .json，或從檔案讀回來 ----------
const SAVE_FILE_ID = 'starhat-wizard';
function saveFileText() {
  return JSON.stringify({ game: SAVE_FILE_ID, version: 1, savedAt: Date.now(), save }, null, 2);
}
function saveFileName() {
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  return `維維小法師存檔_第${save.cleared}關_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.json`;
}
// 檢查檔案內容，不對就回傳 null
function parseSaveFile(text) {
  let o;
  try { o = JSON.parse(text); } catch (e) { return null; }
  if (!o || o.game !== SAVE_FILE_ID || !o.save || typeof o.save !== 'object') return null;
  const s = o.save, isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  if (!Number.isInteger(s.cleared) || s.cleared < 0 || s.cleared > MAX_STAGE) return null;
  if (typeof s.gold !== 'number' || !isFinite(s.gold) || s.gold < 0) return null;
  if (!isObj(s.stars) || !isObj(s.upgrades) || !isObj(s.ranks) || !Array.isArray(s.loadout)) return null;
  return { s, savedAt: o.savedAt };
}
function saveSummary(s) {
  const stars = Object.values(s.stars).reduce((a, b) => a + b, 0);
  return [`Lv.${Math.min(MAX_STAGE, s.cleared + 1)}　已過 ${s.cleared} / ${MAX_STAGE} 關`, `星星 ${stars} / ${MAX_STAGE * 3}　金幣 ${s.gold}`];
}
async function exportSaveFile() {
  const filename = saveFileName(), data = saveFileText();
  // 在 claude.ai 開啟時要透過平台存檔（會先問玩家）；其他地方直接下載
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename, data }); showToast('存檔檔案已儲存'); }
    catch (e) { showToast(e && e.code === 'declined' ? '已取消存檔' : e && e.code === 'rate_limited' ? '請稍等一下再試' : '這裡無法儲存檔案'); }
    return;
  }
  const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  showToast('存檔檔案已下載');
}
const fileInput = document.createElement('input');
fileInput.type = 'file'; fileInput.accept = '.json,application/json'; fileInput.style.display = 'none';
document.body.appendChild(fileInput);
let pendingImport = null;   // 選好檔案、等玩家確認的存檔 { s, savedAt, name }
fileInput.addEventListener('change', () => {
  const f = fileInput.files && fileInput.files[0];
  fileInput.value = '';
  if (!f) return;
  const bad = () => { pendingImport = null; showToast('這不是星帽小法師的存檔檔案'); };
  if (f.size > 1024 * 1024) { bad(); return; }
  const r = new FileReader();
  r.onerror = bad;
  r.onload = () => {
    const parsed = parseSaveFile(String(r.result));
    if (!parsed) { bad(); return; }
    pendingImport = Object.assign(parsed, { name: f.name });
  };
  r.readAsText(f);
});
function confirmImport() {
  if (!pendingImport) return;
  // 音樂、音效開關是這台裝置的設定，不跟著存檔走
  const { muted, musicOff } = save;
  const ok = applySave(pendingImport.s);
  pendingImport = null;
  if (!ok) { showToast('這不是星帽小法師的存檔檔案'); return; }
  save.muted = muted; save.musicOff = musicOff;
  writeSave(); SFX.levelup();
  showToast(`已讀取存檔（已過 ${save.cleared} 關）`);
  goState('select');
}

function heroLv() { return Math.min(MAX_STAGE, save.cleared + 1); }
function slotsFor(lv) { return lv >= 61 ? 7 : lv >= 30 ? 6 : lv >= 14 ? 5 : lv >= 6 ? 4 : 3; }
function learned(id) { return heroLv() >= SPELL[id].unlock; }
function rankOf(id) { return save.ranks[id] || 1; }
function spInfo() {
  const total = (heroLv() - 1) + Object.values(save.stars).filter(s => s >= 3).length;
  const spent = Object.values(save.ranks).reduce((a, r) => a + Math.max(0, r - 1), 0);
  return { total, spent, free: total - spent };
}
// fill：把已學會但沒裝備的魔法自動放進空欄位
function normalizeLoadout(fill) {
  const lv = heroLv(), slots = slotsFor(lv);
  let lo = [...new Set((save.loadout || []).filter(id => SPELL[id] && SPELL[id].type !== 'ult' && learned(id)))];
  if (fill) for (const s of SPELLS) if (s.type !== 'ult' && learned(s.id) && !lo.includes(s.id) && lo.length < slots) lo.push(s.id);
  lo = lo.slice(0, slots);
  if (!lo.length) lo = ['fire'];
  save.loadout = lo;
}
// 把夥伴魔法（召喚飛龍、影子分身…）放進出戰欄：有空格就放，沒空格就換掉最後一格
function equipSpell(id) {
  const lo = save.loadout;
  if (lo.includes(id) || !learned(id)) return;
  if (lo.length < slotsFor(heroLv())) lo.push(id); else lo[lo.length - 1] = id;
}
function equipDragon() { equipSpell('dragon'); }

let AC = null, noiseBuf = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type = 'sine', vol = 0.12, slide = 0, delay = 0) {
  if (!AC || save.muted) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function ensureNoise() {
  if (noiseBuf) return;
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function noise(dur, vol = 0.15, freq = 1200, delay = 0) {
  if (!AC || save.muted) return;
  ensureNoise();
  const t0 = AC.currentTime + delay;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  src.connect(f).connect(g).connect(AC.destination); src.start(t0, Math.random() * 0.4, Math.min(dur, 0.6));
}

function drawEnemy(e) {
  const d = ENEMY[e.type];
  const moving = e.x > e.stopX && e.stun <= 0 && G.timeStop <= 0;
  ctx.save(); ctx.translate(e.x + e.kb, e.y);
  ctx.fillStyle = 'rgba(40,25,50,.22)';
  if (d.air) { ell(0, 614 - e.y, d.r, 5); ctx.fill(); }
  else { ell(e.type === 'ram' ? -16 : 0, 0, d.r * 1.1, 6); ctx.fill(); }
  if (d.air) ctx.translate(0, Math.sin(e.age * 4 + e.id) * 5);
  else if (moving && !d.boss && !(e.root > 0) && !(e.bub > 0)) ctx.translate(0, -Math.abs(Math.sin(e.walk * 0.12)) * 4);
  if (e.bub > 0) ctx.translate(0, -Math.min(40, (e.bubMax - e.bub) * 80));
  if (e.charm > 0) ctx.scale(-1, 1);   // 被魅惑：轉身面向右邊
  if (e.stealth && !d.dive) ctx.globalAlpha = 0.22 + Math.sin(e.age * 6) * 0.08;
  if (e.flash > 0) ctx.scale(1.08, 0.94);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (HAS_FEET[e.type]) feet(moving ? Math.sin(e.walk * 0.12) : 0);
  DRAWERS[e.type](e);
  ctx.globalAlpha = 1;
  drawStatus(e, d);
  if (e.mark > 0) {
    ctx.lineWidth = 4; ctx.strokeStyle = '#ff4a5a';
    circ(0, -d.h * 0.5, 15); ctx.stroke(); circ(0, -d.h * 0.5, 4); ctx.fillStyle = '#ff4a5a'; ctx.fill();
  }
  const oy = -d.h / 2, orx = e.type === 'ram' ? 70 : d.boss ? d.r * 1.6 : d.r + 6, ory = d.h / 2 + 4, ox = e.type === 'ram' ? -16 : 0;
  if (e.flash > 0) { ctx.globalAlpha = 0.45; ctx.fillStyle = '#fff'; ell(ox, oy, orx, ory); ctx.fill(); }
  if (e.frz > 0) { ctx.globalAlpha = 0.5; ctx.fillStyle = '#bff0ff'; ell(ox, oy, orx, ory); ctx.fill(); ctx.globalAlpha = 1; ctx.lineWidth = 3; ctx.strokeStyle = '#62cfff'; ctx.stroke(); }

  if (e.stun > 0 && e.frz <= 0) {

      const a = T * 6 + i * 2.1;

function showToast(s) { toast = { s, t: 2 }; }
function goState(s) { state = s; transT = 0.35; P.down = false; }

function enterLevel(n) {
  // 舊存檔已打過第 20 關：補播飛龍成為夥伴的劇情
  if (save.cleared >= 20 && !save.seen.dragonOath) { equipDragon(); playStory('dragonOath', () => enterLevel(n)); return; }
  const id = 'pre' + n;
  // 第二部開場：影子成為夥伴，「影子分身」自動放進新的第 7 格
  if (STORY[id] && !save.seen[id]) playStory(id, () => { if (n === 61) { equipSpell('clone'); writeSave(); } startLevel(n); });
  else startLevel(n);
}
function playStory(id, onDone) {
  story = { id, sc: STORY[id], i: 0, shown: 0, onDone };
  save.seen[id] = true; writeSave();
  goState('story');
}
function advanceStory() {
  if (!story) return;
  const text = story.sc.lines[story.i][1];
  if (story.shown < text.length) { story.shown = text.length; return; }
  story.i++; story.shown = 0;
  if (story.i >= story.sc.lines.length) endStory();
}
function endStory() {
  if (!story) return;
  const done = story.onDone;
  story = null; done();
}
function chapterOf(n) { return Math.min(PLAY_CHAPTERS - 1, Math.floor((n - 1) / 10)); }

function startLevel(n) {
  const L = LEVELS[n - 1], lv = heroLv(), u = save.upgrades;
  const queue = [];
  for (const [t0, type, cnt, iv] of L.groups) for (let i = 0; i < cnt; i++) queue.push({ t: t0 + i * iv, type });
  queue.sort((a, b) => a.t - b.t);
  normalizeLoadout(false);
  const mpMax = BAL.mpBase + BAL.mpPerLv * (lv - 1) + BAL.crystalMp * u.crystal;
  const castleMax = Math.round(BAL.castle * (1 + BAL.wallPct * u.wall));
  G = {
    stage: n, L, ch: chapterOf(n), t: 0, queue, total: queue.length,
    enemies: [], projs: [], shots: [], spikes: [], meteors: [], zones: [], feathers: [], fx: [], texts: [],
    castleMax, castleHp: castleMax, barrier: 0, barrierT: 0,
    mpMax, mp: mpMax, mpRegen: BAL.regenBase + BAL.regenPerLv * (lv - 1) + BAL.springRegen * u.spring,
    power: (1 + BAL.powerPerLv * (lv - 1)) * (1 + BAL.staffPct * (u.staff || 0)),

function spawn(type, fromQueue, x) {
  const d = ENEMY[type];
  const hp = Math.round(d.boss ? d.hp : d.hp * G.hpMul);
  let y;
  if (d.boss === 2) y = 250; else if (d.boss === 3) y = 330; else if (d.boss === 4) y = 240; else if (d.boss === 5) y = 320; else if (d.boss === 6) y = 350;
  else if (d.boss === 7) y = GROUND + 6; else if (d.boss === 8) y = GROUND + 4;
  else if (d.air) y = d.fly[0] + Math.random() * (d.fly[1] - d.fly[0]);
  else y = GROUND - 8 + Math.random() * 28;
  const e = {
    id: G.nextId++, type, q: !!fromQueue, x: x != null ? x : W + 40 + Math.random() * 40, y, baseY: y,
    hp, max: hp, atk: 0.3 + Math.random() * 0.5, walk: Math.random() * 50, age: Math.random() * 10,
    slow: 0, stun: 0, frz: 0, flash: 0, swing: 0, kb: 0, dead: false, stealth: !!d.stealth, dash: false,
    stopX: d.range ? WALL_X + d.range + (d.boss ? 0 : Math.random() * 140) : WALL_X + (d.reach || d.r) + Math.random() * 16,
    phase: 1, sumT: 9, mirT: 7, mirror: 0, pt: 0, patrol: false, blockT: 0,
    blinkT: 1.5 + Math.random() * 1.5, vshield: 0, vsT: 8, tpT: 6, sealT: 5,
    mark: 0, markAmp: 1, phased: false, phaseT: 2.5 + Math.random() * 1.5,
    root: 0, psn: 0, psnDps: 0, wet: 0, charm: 0, bub: 0, bubMax: 0, bubDmg: 0, pshield: 0, haste: 0, burnT: 0, revived: false,
    sub: 0, subT: 12, inkT: 10, tentT: 6,
  };
  if (d.boss) { e.x = W + 120; G.boss = e; G.bossIntro = 2.5; G.shake = 12; SFX.roar(); }
  G.enemies.push(e);
  return e;
}

function addText(s, x, y, color, size = 24) {
  if (G.texts.length > 60) G.texts.shift();
  G.texts.push({ s: String(s), x, y, color, size, life: 0.8, max: 0.8 });
}
function burst(x, y, n, colors, spd = 200, g = 400, size = 5, life = 0.6) {
  if (G.fx.length > 380) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.3 + Math.random() * 0.7);
    G.fx.push({ type: 'p', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g, size: size * (0.6 + Math.random() * 0.6),
      color: colors[i % colors.length], life: life * (0.6 + Math.random() * 0.5), max: life });

}
function msg(s) { if (G.noMpT <= 0) { addText(s, WIZ.x + 60, WIZ.y - 180, '#ffffff', 24); G.noMpT = 0.6; } }

// 敵人身體中心
const cy = e => e.y - ENEMY[e.type].h * 0.45;
// 可以自動瞄準的敵人（隱身、被魅惑、潛入深海的不算）
const foe = e => !e.dead && !e.stealth && !(e.charm > 0) && !(e.sub > 0);
function nearestEnemy(x, y, maxD, ok) {
  let best = null, bd = maxD;
  for (const e of G.enemies) {
    if (e.dead || e.stealth || e.charm > 0 || e.sub > 0 || (ok && !ok(e))) continue;
    const d = Math.hypot(e.x - x, cy(e) - y);
    if (d < bd) { bd = d; best = e; }
  }

        if (!e.dead) applyStun(e, 1.5 + 0.2 * (r - 1));
      }
      G.shake = 18;
      for (let i = 0; i < 10; i++) burst(300 + i * 100, 610, 4, ['#d9a066', '#a8703f', '#ffffff'], 200, 600, 7, 0.7);
      G.fx.push({ type: 'quake', life: 0.8, max: 0.8 });
      SFX.quake(); break;
    case 'surge':
      G.surge = 8 + (r - 1);
      burst(WIZ.x, WIZ.y - 60, 24, ['#7ad7ff', '#ffffff'], 300, 0, 7, 0.6);
      SFX.surge(); break;
    // ---------- 第二部的魔法 ----------
    case 'clone': {
      const t = 10 + (r - 1);
      G.clone = { t, max: t, pow: 0.6 + 0.08 * (r - 1), age: 0, cast: 0 };
      addText('影子分身！', WIZ.x + 140, WIZ.y - 210, '#d0a8ff', 30);

    }
    case 'vine': {
      const t = 3 + 0.3 * (r - 1);
      G.zones.push({ kind: 'vine', x: Math.min(gx, W - 60), t, max: t, dps: dmg, tick: 0, rootT: t });
      for (const e of G.enemies) {
        const d = ENEMY[e.type];
        if (e.dead || d.air || e.charm > 0 || Math.abs(e.x - Math.min(gx, W - 60)) > 130) continue;
        if (d.boss) e.slow = Math.max(e.slow, t); else e.root = Math.max(e.root, t);
      }
      burst(Math.min(gx, W - 60), 600, 16, ['#5ac85a', '#7be35a', '#ffffff'], 220, 300, 6, 0.5);
      SFX.wind(); break;
    }
    case 'spore': {
      const R = 110;
      for (const e of G.enemies) {
        if (e.dead || e.charm > 0 || Math.hypot(e.x - x, cy(e) - y) > R + ENEMY[e.type].r) continue;
        e.psn = 6; e.psnDps = Math.max(e.psnDps, dmg);
      }
      G.fx.push({ type: 'ring', x, y, r: R, life: 0.4, max: 0.4, color: '#b77ae0' });
      for (let i = 0; i < 18; i++) G.fx.push({ type: 'p', x: x + (Math.random() - 0.5) * 160, y: y + (Math.random() - 0.5) * 120, vx: (Math.random() - 0.5) * 40, vy: -30 - Math.random() * 40, g: 0, size: 9, color: i % 3 ? '#b77ae0' : '#d9b8ff', life: 1, max: 1 });
      SFX.poof(); break;
    }
    case 'charm': {
      const n = 3 + (r >= 3 ? 1 : 0) + (r >= 5 ? 1 : 0), t = 8 + (r - 1);
      for (const e of pool.slice(0, n)) {
        e.charm = t; e.atk = 0.4; e.stun = 0;
        drawHeartFx(e.x, cy(e) - 30);
        addText('變成夥伴了！', e.x, e.y - ENEMY[e.type].h - 20, '#ff8fc8', 20);
      }
      burst(x, y, 16, ['#ff8fc8', '#ffd0e8', '#ffffff'], 220, 0, 6, 0.5);
      SFX.heal(); break;
    }
    case 'mirror':
      G.mirrorT = 6 + (r - 1); G.mirrorDmg = dmg;
      burst(WALL_X + 24, 480, 20, ['#bfe8ff', '#ffffff'], 240, 0, 6, 0.5);
      SFX.shield(); break;
    case 'bless': {
      const t = 2 + 0.25 * (r - 1);
      for (const e of G.enemies) {
        const d = ENEMY[e.type];
        if (e.dead || d.air || e.charm > 0) continue;
        if (d.boss) e.slow = Math.max(e.slow, t); else e.root = Math.max(e.root, t);
        burst(e.x, e.y - 10, 4, ['#8a5a32', '#5ac85a'], 120, 300, 5, 0.4);
      }
      G.bless = { t: 8, rate: 0.015 * (1 + 0.2 * (r - 1)), leaf: 0 };
      addText('樹王的祝福！', 640, 220, '#7be38a', 34);
      G.shake = Math.max(G.shake, 8);
      SFX.heal(); break;
    }
    case 'wave':
      G.waves.push({ x: WALL_X - 20, dmg, push: 200 + 20 * (r - 1), hit: new Set() });
      G.shake = Math.max(G.shake, 6);
      SFX.wind(); break;
    case 'bubble': {
      const n = 3 + (r >= 3 ? 1 : 0) + (r >= 5 ? 1 : 0);
      for (const e of pool.slice(0, n)) {
        if (ENEMY[e.type].boss) { damage(e, dmg, 'bubble'); continue; }
        e.bub = 4; e.bubMax = 4; e.bubDmg = dmg;
      }
      burst(x, y, 14, ['#9fe6ff', '#ffffff'], 200, 0, 6, 0.4);
      SFX.poof(); break;
    }
    case 'trident': {
      damage(target, dmg, 'trident');
      if (!target.dead) applyStun(target, 0.5);
      G.fx.push({ type: 'trident', x: target.x, y: cy(target), life: 0.5, max: 0.5 });
      const pts = [];
      for (const e of G.enemies) {
        if (e.dead || e === target || !(e.wet > 0) || e.charm > 0 || Math.hypot(e.x - target.x, cy(e) - cy(target)) > 320) continue;
        damage(e, dmg * 0.6, 'trident');
        pts.push({ x: e.x, y: cy(e) });
      }
      for (const p of pts) G.fx.push({ type: 'bolt', pts: [{ x: target.x, y: cy(target) }, p], life: 0.3, max: 0.3, w: 0.7 });
      G.shake = Math.max(G.shake, 7);
      SFX.thunder(); break;
    }
    case 'whale':
      G.whales.push({ x: Math.max(WALL_X + 60, Math.min(x, W - 80)), t: 0, dur: 0.9, dmg, R: 150 + 10 * (r - 1), hit: false });
      burst(Math.max(WALL_X + 60, Math.min(x, W - 80)), 610, 10, ['#bfe8ff', '#ffffff'], 160, 300, 5, 0.5);
      SFX.wind(); break;
  }
  return true;
}

function spellCost(sp) { return G && G.surge > 0 ? Math.ceil(sp.cost / 2) : sp.cost; }

function castChain(first, dmg, hits) {
  const pts = [{ x: first.x + 10, y: 60 }];
  const hit = new Set();
  let cur = first;
  for (let i = 0; i < hits && cur; i++) {
    hit.add(cur.id);
    pts.push({ x: cur.x, y: cy(cur) });
    damage(cur, dmg, 'bolt');
    if (!cur.dead) applyStun(cur, 0.6);
    burst(cur.x, cy(cur), 5, ['#fff36b', '#ffffff'], 200, 0, 4, 0.3);
    dmg *= 0.8;
    let nx = null, nd = 210;
    for (const e of G.enemies) {
      if (e.dead || e.stealth || e.charm > 0 || e.sub > 0 || hit.has(e.id)) continue;
      const d = Math.hypot(e.x - cur.x, e.y - cur.y);
      if (d < nd) { nd = d; nx = e; }
    }
    cur = nx;
  }
  G.fx.push({ type: 'bolt', pts, life: 0.32, max: 0.32 });
  G.fx.push({ type: 'cloud', x: first.x + 10, life: 0.6, max: 0.6 });
  G.fx.push({ type: 'screen', life: 0.1, max: 0.1 });
  G.shake = Math.max(G.shake, 5);
  SFX.zap();
}

function explode(x, y, R, dmg, groundOnly, kind) {
  for (const e of G.enemies) {
    if (e.dead || (groundOnly && ENEMY[e.type].air)) continue;
    if (Math.hypot(e.x - x, (cy(e) - y) * 0.8) <= R + ENEMY[e.type].r * 0.5) damage(e, dmg, kind || (groundOnly ? 'meteor' : 'fire'));
  }
  G.fx.push({ type: 'ring', x, y, r: R, life: 0.3, max: 0.3, color: '#ffb03d' });
  G.fx.push({ type: 'flash', x, y, r: R * 0.9, life: 0.15, max: 0.15 });
  burst(x, y, 12, ['#ff7a3d', '#ffb03d', '#ffe36b'], 260, 300, 7, 0.55);
  burst(x, y, 4, ['#9a8fae', '#c9bfd3'], 60, -80, 10, 0.9);
  G.shake = Math.max(G.shake, 3);
  SFX.boom();
}

// ============================================================
//  更新
// ============================================================
function update(dt) {
  if (!G || G.paused) return;
  updateFx(dt);
  if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; }
  if (G.over) {
    G.overT += dt;
    if (G.postStory && G.overT > 1.6) { const id = G.postStory; G.postStory = null; playStory(id, () => goState('play')); }
    return;
  }
  const frozen = G.timeStop > 0;
  if (frozen) G.timeStop = Math.max(0, G.timeStop - dt);
  else {
    G.t += dt;
    while (G.queue.length && G.queue[0].t <= G.t) spawn(G.queue.shift().type, true);
  }
  const surge = G.surge > 0;
  if (surge) G.surge -= dt;
  G.mp = Math.min(G.mpMax, G.mp + G.mpRegen * (surge ? 1.5 : 1) * dt);
  for (const k in G.cds) if (G.cds[k] > 0) G.cds[k] = Math.max(0, G.cds[k] - dt * (surge ? 2 : 1));
  G.castAnim = Math.max(0, G.castAnim - dt);
  G.shake = Math.max(0, G.shake - 40 * dt);
  G.castleFlash -= dt; G.noMpT -= dt; G.hintT -= dt; G.reflectT -= dt; G.bossIntro -= dt; G.owlAnim -= dt;
  G.introT -= dt; G.goldBump = Math.max(0, G.goldBump - dt); G.mpFlash = Math.max(0, G.mpFlash - dt);
  // 時光倒流用：記下最近 6 秒的城堡耐久
  G.histT -= dt;
  if (G.histT <= 0) { G.histT = 0.5; G.hist.push(G.castleHp); if (G.hist.length > 12) G.hist.shift(); }
  if (G.barrierT > 0) { G.barrierT -= dt; if (G.barrierT <= 0) G.barrier = 0; }
  if (P.down && P.onField && SPELL[G.sel].type === 'target') useSpell(G.sel, P.x, P.y, true);

  if (!frozen) updateEnemies(dt);
  updateMagic(dt);
  if (!frozen) updateShots(dt);

  G.enemies = G.enemies.filter(e => !e.dead);
  if (G.castleHp <= 0) finish(false);
  else if (!G.queue.length && !G.enemies.length && !G.regrow.length) finish(true);
}

function updateEnemies(dt) {
  for (const e of G.enemies) {
    if (e.dead) continue;
    const d = ENEMY[e.type];
    e.flash -= dt; e.blockT -= dt; e.age += dt; e.kb = Math.max(0, e.kb - 50 * dt);
    e.swing = Math.max(0, e.swing - dt); e.frz = Math.max(0, e.frz - dt);
    if (e.slow > 0) e.slow -= dt;
    if (e.mark > 0) e.mark -= dt;
    if (e.root > 0) e.root -= dt;
    if (e.wet > 0) e.wet -= dt;
    if (e.haste > 0) e.haste -= dt;
    if (e.burnT > 0) e.burnT -= dt;
    if (G.blizzard > 0) e.slow = Math.max(e.slow, 0.3);
    // 幽靈：一下實體、一下透明
    if (d.phasing) {
      e.phaseT -= dt;
      if (e.phaseT <= 0) { e.phased = !e.phased; e.phaseT = e.phased ? 1 : 3.5; }
    }
    // 巨木守衛、樹王：每秒再生，被火燒到時暫停
    if (d.regen && e.burnT <= 0 && e.hp < e.max) e.hp = Math.min(e.max, e.hp + e.max * d.regen * dt);
    // 泡泡牢籠：關住時什麼都不能做，泡泡破掉造成傷害
    if (e.bub > 0) {
      e.bub -= dt;
      if (e.bub <= 0) popBubble(e);
      continue;
    }
    if (e.stun > 0) { e.stun -= dt; continue; }
    if (e.charm > 0) { charmedUpdate(e, d, dt); continue; }
    if (d.boss) { bossUpdate(e, dt); continue; }
    const sm = (e.slow > 0 ? (d.heavy ? 0.75 : 0.5) : 1) * (e.haste > 0 ? 1.6 : 1);
    // 騎士血量剩一半開始衝鋒
    if (d.charge && !e.dash && e.hp < e.max * 0.5) { e.dash = true; addText('衝鋒！', e.x, e.y - d.h - 20, '#ff8aa0', 24); }
    if (e.stealth && e.x < WALL_X + (d.dive ? 300 : 420)) {
      e.stealth = false; e.dash = !d.dive;
      if (d.dive) {
        burst(e.x, e.y - 20, 16, ['#bfe8ff', '#ffffff', '#4fb8ff'], 260, 500, 7, 0.6);
        addText('跳出來了！', e.x, e.y - 100, '#8fd8ff', 22);
      } else {
        burst(e.x, cy(e), 12, ['#2f3550', '#6a6a8a', '#ffffff'], 200, 0, 7, 0.5);
        addText('現形！', e.x, e.y - 100, '#ff8a8a', 22);
      }
    }
    // 後排支援：花妖套護盾、海螺號角手讓周圍加速
    if (d.support && e.x <= e.stopX + 1) {
      e.atk -= dt;
      if (e.atk <= 0) { e.atk = d.atkCd; e.swing = 0.6; supportCast(e, d); }
    }
    // 薑餅巨人擋住地面的近戰敵人
    const wall = G.wall && !d.air && !d.range && e.x >= G.wall.x - 4 ? G.wall : null;
    const stop = wall ? Math.max(e.stopX, wall.x + (d.reach || d.r)) : e.stopX;
    // 被藤蔓、樹根綁住：不能移動，但還是能攻擊
    if (e.root > 0 && e.x > stop) continue;
    if (d.support) {
      if (e.x > stop) { const mv = d.speed * sm * dt; e.x = Math.max(stop, e.x - mv); e.walk += mv; }
      continue;
    }
    if (d.blink) {
      e.blinkT -= dt;
      if (e.blinkT <= 0 && e.x - 150 > stop) {
        burst(e.x, cy(e), 8, ['#9a5ae0', '#ffffff'], 160, 0, 6, 0.4);
        e.x -= 150; e.blinkT = 2.5;
        burst(e.x, cy(e), 8, ['#9a5ae0', '#ffffff'], 160, 0, 6, 0.4);
        SFX.poof();
      }
    }
    if (e.x > stop) {
      const mv = d.speed * (e.dash ? 2 : 1) * sm * dt;
      e.x = Math.max(stop, e.x - mv); e.walk += mv;
      if (d.air) e.y = e.baseY;
    } else {
      if (d.bomber) {
        if (wall) wall.hp -= d.dmg * G.dmgMul; else hitCastle(d.dmg * G.dmgMul);
        G.fx.push({ type: 'ring', x: e.x, y: cy(e), r: 70, life: 0.3, max: 0.3, color: '#ff8a3d' });
        burst(e.x, cy(e), 14, ['#ff7a3d', '#3a3550', '#ffe36b'], 260, 300, 7, 0.5);
        SFX.blast();
        kill(e, { noGold: true, self: true });
        continue;
      }
      e.atk -= dt * sm;
      if (e.atk <= 0) {
        e.atk = d.atkCd; e.swing = 0.3;
        if (wall) {
          wall.hp -= d.dmg * G.dmgMul;
          burst(wall.x + 10, 520 + Math.random() * 80, 3, ['#bfeaff', '#ffffff'], 140, 400, 5, 0.4);
        }
        else if (d.healer) shamanHeal(e);
        else if (d.range) shoot(e, d.shot || 'arrow');
        else { hitCastle(d.dmg * G.dmgMul); if (G.thorns) damage(e, G.thorns, 'thorns'); }
      }
    }
  }
  // 樹精寶寶長回來
  for (const r of G.regrow) {
    r.t -= dt;
    if (r.t > 0) continue;
    r.done = true;
    const s = spawn('sprout', false, r.x);
    s.y = s.baseY = r.y; s.revived = true; s.hp = s.max = Math.round(s.max * 0.6);
    burst(r.x, r.y - 30, 14, ['#7be35a', '#b5824a', '#ffffff'], 200, 300, 6, 0.5);
  }
  G.regrow = G.regrow.filter(r => !r.done);
}

// 泡泡破掉
function popBubble(e) {
  e.bub = 0;
  burst(e.x, cy(e) - 20, 16, ['#9fe6ff', '#ffffff', '#4fb8ff'], 260, 200, 6, 0.5);
  SFX.poof();
  damage(e, e.bubDmg, 'bubble');
}
// 被魅惑的敵人：轉身去打最近的其他敵人
function charmedUpdate(e, d, dt) {
  e.charm -= dt;
  let tgt = null, bd = 1e9;
  for (const o of G.enemies) {
    if (o.dead || o === e || o.charm > 0 || o.stealth || o.sub > 0) continue;
    const dd = Math.abs(o.x - e.x) + (d.air === !!ENEMY[o.type].air ? 0 : 60);
    if (dd < bd) { bd = dd; tgt = o; }
  }
  if (e.charm <= 0) { addText('清醒了', e.x, e.y - d.h - 10, '#ffd0e8', 18); return; }
  if (!tgt) return;
  const reach = d.r + ENEMY[tgt.type].r + 10, dx = tgt.x - e.x;
  if (Math.abs(dx) > reach && d.speed > 0) {
    const mv = Math.max(60, d.speed * 1.3) * dt;
    e.x += Math.sign(dx) * Math.min(Math.abs(dx) - reach, mv); e.walk += mv;
    e.x = Math.min(W - 10, Math.max(WALL_X + 20, e.x));
  } else {
    e.atk -= dt;
    if (e.atk <= 0) {
      e.atk = Math.max(0.8, d.atkCd); e.swing = 0.3;
      damage(tgt, Math.max(10, d.dmg) * G.dmgMul * 2.5, 'ally');
      drawHeartFx(tgt.x, cy(tgt));
    }
  }
}
function drawHeartFx(x, y) { G.fx.push({ type: 'heart', x, y, life: 0.6, max: 0.6 }); }
// 花妖、海螺號角手的支援
function supportCast(e, d) {
  if (d.support === 'petal') {
    for (const o of G.enemies) {
      if (o.dead || o === e || o.charm > 0 || ENEMY[o.type].boss || Math.abs(o.x - e.x) > 220) continue;
      o.pshield = Math.max(o.pshield, o.max * 0.3);
    }
    G.fx.push({ type: 'ring', x: e.x, y: cy(e), r: 220, life: 0.5, max: 0.5, color: '#ff9fd0' });
    burst(e.x, e.y - 60, 10, ['#ff9fd0', '#ffd0e8'], 180, -30, 6, 0.6);
    SFX.heal2();
  } else {
    for (const o of G.enemies) {
      if (o.dead || o === e || o.charm > 0 || ENEMY[o.type].boss || Math.abs(o.x - e.x) > 300) continue;
      o.haste = 3;
    }
    G.fx.push({ type: 'ring', x: e.x - 40, y: e.y - 64, r: 300, life: 0.5, max: 0.5, color: '#ffffff' });
    SFX.wind();
  }
}

function shamanHeal(e) {
  let n = 0;
  for (const o of G.enemies) {
    if (o.dead || o === e || ENEMY[o.type].boss || o.hp >= o.max || Math.abs(o.x - e.x) > 180) continue;
    o.hp = Math.min(o.max, o.hp + o.max * 0.15); n++;
    burst(o.x, cy(o), 4, ['#7be38a', '#ffffff'], 80, -60, 5, 0.5);
  }
  if (n) { G.fx.push({ type: 'ring', x: e.x, y: cy(e), r: 180, life: 0.5, max: 0.5, color: '#7be38a' }); SFX.heal2(); }
}

function bossUpdate(e, dt) {
  const d = ENEMY[e.type], ratio = e.hp / e.max;
  const ph = d.boss === 3 || d.boss >= 5 ? (ratio > 0.66 ? 1 : ratio > 0.33 ? 2 : 3) : (ratio > 0.5 ? 1 : 2);
  if (ph !== e.phase) {
    e.phase = ph; G.shake = 12; SFX.roar();
    addText('狂暴化！', e.x, e.y - d.h - 20, '#ff5a5a', 34);
  }
  const sm = e.slow > 0 ? 0.75 : 1;
  e.sumT -= dt;
  if (d.boss === 1) {
    if (e.x > e.stopX) { const mv = d.speed * sm * dt; e.x = Math.max(e.stopX, e.x - mv); e.walk += mv; }
    else {
      e.atk -= dt * sm;
      if (e.atk <= 0) { e.atk = ph === 1 ? 2.6 : 1.7; e.swing = 0.4; shoot(e, 'bomb'); }
    }
    if (e.sumT <= 0) {
      e.sumT = 12;
      for (let i = 0; i < (ph === 1 ? 3 : 4); i++) spawn('bandit', false, e.x + 40 + i * 24);
      addText('小弟們，上！', e.x, e.y - d.h - 20, '#ffffff', 26);
    }
  } else if (d.boss === 2) {
    if (!e.patrol && e.x > 840) e.x -= d.speed * sm * dt;
    else { e.patrol = true; e.pt += dt * sm; e.x = 840 + Math.sin(e.pt * 0.5) * 170; }
    e.y = e.baseY + Math.sin(e.age * 2) * 14;
    e.atk -= dt * sm;
    if (e.atk <= 0 && e.patrol) { e.atk = ph === 1 ? 2.8 : 1.9; e.swing = 0.4; shoot(e, 'breath'); }
    if (e.sumT <= 0) {
      e.sumT = 13;
      for (let i = 0; i < 3; i++) spawn('bat', false, e.x + i * 20);
      if (ph === 2) for (let i = 0; i < 2; i++) spawn('wolf', false, W + 40 + i * 40);
    }
  } else if (d.boss === 4) {
    // 空賊飛船：巡航、三連發砲彈、空投小兵
    if (!e.patrol && e.x > 900) e.x -= d.speed * sm * dt;
    else { e.patrol = true; e.pt += dt * sm; e.x = 900 + Math.sin(e.pt * 0.45) * 150; }
    e.y = e.baseY + Math.sin(e.age * 1.5) * 10;
    e.atk -= dt * sm;
    if (e.atk <= 0 && e.patrol) { e.atk = ph === 1 ? 3.2 : 2.2; e.swing = 0.4; for (let i = 0; i < 3; i++) shoot(e, 'bomb'); SFX.blast(); }
    if (e.sumT <= 0) {
      e.sumT = 12;
      for (let i = 0; i < 3; i++) spawn('bandit', false, e.x - 40 + i * 40);
      spawn('balloon', false, W + 40);
      if (ph === 2) for (let i = 0; i < 2; i++) spawn('imp', false, e.x + 60 + i * 30);
      addText('空投！', e.x, e.y - d.h - 10, '#ffffff', 28);
    }
  } else if (d.boss === 5) {
    // 虛空魔王：瞬移、虛空護盾、虛空彈、召喚
    if (!e.patrol && e.x > 940) e.x -= d.speed * dt;
    else { e.patrol = true; e.pt += dt; if (ph === 1) e.x = 940 + Math.sin(e.pt * 0.4) * 80; }
    if (e.patrol && ph >= 2) {
      e.tpT -= dt;
      if (e.tpT <= 0) {
        e.tpT = ph === 3 ? 4.5 : 6;
        burst(e.x, cy(e), 20, ['#7a3cff', '#7af0ff'], 300, 0, 8, 0.5);
        e.x = 720 + Math.random() * 380;
        burst(e.x, cy(e), 20, ['#7a3cff', '#7af0ff'], 300, 0, 8, 0.5);
        SFX.poof();
      }
    }
    e.y = e.baseY + Math.sin(e.age * 1.4) * 16;
    if (e.patrol && e.vshield <= 0) {
      e.vsT -= dt;
      if (e.vsT <= 0) { e.vshield = 700 + 300 * ph; e.vsT = ph === 3 ? 9 : 12; addText('虛空護盾！', e.x, e.y - d.h - 30, '#7af0ff', 30); SFX.shield(); }
    }
    e.atk -= dt * sm;
    if (e.atk <= 0 && e.patrol) { e.atk = ph === 1 ? 2.2 : ph === 2 ? 1.8 : 1.3; e.swing = 0.4; shoot(e, 'orb'); if (ph === 3) shoot(e, 'orb'); }
    if (e.sumT <= 0) {
      e.sumT = ph === 3 ? 12 : 14;
      const wave = ph === 1 ? ['imp', 'imp', 'imp'] : ph === 2 ? ['balloon', 'harpy', 'harpy', 'imp'] : ['golem', 'imp', 'imp', 'imp'];
      wave.forEach((t, i) => spawn(t, false, W + 40 + i * 50));
      addText('虛空召喚！', e.x, e.y - d.h - 30, '#c08aff', 28);
    }
  } else if (d.boss === 6) {
    // 暗影維維：暗影彈、封印玩家的魔法、召喚
    if (!e.patrol && e.x > 900) e.x -= d.speed * sm * dt;
    else { e.patrol = true; e.pt += dt * sm; e.x = 900 + Math.sin(e.pt * 0.5) * 130; }
    e.y = e.baseY + Math.sin(e.age * 1.8) * 14;
    if (e.patrol && ph >= 2) {
      e.sealT -= dt;
      if (e.sealT <= 0) {
        e.sealT = ph === 3 ? 8 : 11;
        const pool = G.loadout.filter(id => G.cds[id] < 6);
        if (pool.length) {
          const id = pool[Math.floor(Math.random() * pool.length)];
          G.cds[id] = 6;
          addText('封印：' + SPELL[id].name + '！', WIZ.x + 120, WIZ.y - 200, '#d0a8ff', 30);
          burst(WIZ.x, WIZ.y - 80, 16, ['#8a3cff', '#d0a8ff'], 220, 0, 6, 0.5);
          SFX.crack();
        }
      }
    }
    e.atk -= dt * sm;
    if (e.atk <= 0 && e.patrol) { e.atk = ph === 1 ? 2 : ph === 2 ? 1.7 : 1.3; e.swing = 0.4; shoot(e, 'orb'); if (ph === 3) shoot(e, 'orb'); }
    if (e.sumT <= 0) {
      e.sumT = ph === 3 ? 12 : 14;
      const wave = ph === 1 ? ['ghost', 'ghost', 'witch'] : ph === 2 ? ['knight', 'witch', 'ghost', 'ghost'] : ['golem', 'knight', 'knight', 'witch'];
      wave.forEach((t, i) => spawn(t, false, W + 40 + i * 50));
      addText('暗影召喚！', e.x, e.y - d.h - 30, '#c08aff', 28);
    }
  } else if (d.boss === 7) {
    // 迷霧樹王：慢慢走到城牆前，從地底放樹根衝擊城牆、召喚森林的敵人；一直再生（被火燒到時停止）
    if (e.x > e.stopX) { const mv = d.speed * sm * dt; e.x = Math.max(e.stopX, e.x - mv); e.walk += mv; }
    if (e.x < W - 40) {
      e.atk -= dt * sm;
      if (e.atk <= 0) { e.atk = ph === 1 ? 3 : ph === 2 ? 2.3 : 1.7; e.swing = 0.4; shoot(e, 'root'); }
    }
    if (e.sumT <= 0) {
      e.sumT = ph === 3 ? 11 : 13;
      const wave = ph === 1 ? ['sprout', 'sprout', 'firefly', 'firefly', 'firefly'] : ph === 2 ? ['flower', 'sprout', 'sprout', 'firefly', 'firefly'] : ['treant', 'flower', 'sprout', 'sprout'];
      wave.forEach((t, i) => spawn(t, false, W + 40 + i * 50));
      addText('森林的孩子們！', e.x, e.y - d.h - 30, '#9fe08a', 28);
    }
  } else if (d.boss === 8) {
    // 深海巨妖：待在海裡發射水彈、從城牆前伸出觸手、噴墨汁，第三階段會潛水
    if (!e.patrol && e.x > 1000) e.x -= d.speed * dt;
    else { e.patrol = true; e.pt += dt; e.x = 1000 + Math.sin(e.pt * 0.35) * 40; }
    if (e.sub > 0) {
      e.sub -= dt;
      if (e.sub <= 0) { addText('浮上來了！', e.x, e.y - 240, '#8fd8ff', 30); burst(e.x, e.y - 60, 30, ['#bfe8ff', '#ffffff', '#4fb8ff'], 360, 500, 8, 0.7); G.shake = 8; }
      return;
    }
    if (!e.patrol) return;
    e.atk -= dt * sm;
    if (e.atk <= 0) { e.atk = ph === 1 ? 2.4 : ph === 2 ? 2 : 1.6; e.swing = 0.4; shoot(e, 'water'); }
    e.tentT -= dt;
    if (e.tentT <= 0) {
      e.tentT = ph === 1 ? 13 : 10;
      const alive = G.enemies.filter(o => !o.dead && o.type === 'tentacle').length;
      const n = Math.min(ph === 1 ? 1 : 2, 3 - alive);
      for (let i = 0; i < n; i++) {
        const t = spawn('tentacle', false, WALL_X + 130 + Math.random() * 140);
        t.y = t.baseY = GROUND + 4 + Math.random() * 10;
        burst(t.x, GROUND, 16, ['#c9a0d8', '#ffffff', '#4fb8ff'], 260, 500, 7, 0.6);
      }
      if (n > 0) { addText('觸手！', WALL_X + 200, 380, '#ff8fd0', 30); G.shake = Math.max(G.shake, 8); SFX.quake(); }
    }
    if (ph >= 2) {
      e.inkT -= dt;
      if (e.inkT <= 0) { e.inkT = ph === 3 ? 9 : 11; shoot(e, 'ink'); addText('噴墨汁！', e.x, e.y - d.h - 30, '#b0a0c8', 28); }
    }
    if (ph === 3) {
      e.subT -= dt;
      if (e.subT <= 0) {
        e.subT = 12; e.sub = 3;
        addText('潛入深海！', e.x, e.y - 240, '#8fd8ff', 30);
        burst(e.x, e.y - 60, 30, ['#bfe8ff', '#ffffff', '#4fb8ff'], 360, 500, 8, 0.7); SFX.poof();
      }
    }
    if (e.sumT <= 0) {
      e.sumT = ph === 3 ? 12 : 14;
      const wave = ph === 1 ? ['crab', 'jelly', 'jelly'] : ph === 2 ? ['shark', 'shark', 'conch'] : ['crab', 'crab', 'shark', 'jelly'];
      wave.forEach((t, i) => spawn(t, false, W + 40 + i * 50));
      addText('海底軍團！', e.x, e.y - d.h - 30, '#8fd8ff', 28);
    }
  } else {
    if (!e.patrol && e.x > 920) e.x -= d.speed * dt;
    else { e.patrol = true; e.pt += dt; e.x = 920 + Math.sin(e.pt * 0.4) * 90; }
    e.y = e.baseY + Math.sin(e.age * 1.6) * 14;
    if (e.mirror > 0) e.mirror -= dt;
    else if (e.patrol) {
      e.mirT -= dt;
      if (e.mirT <= 0) { e.mirror = 2.5; e.mirT = ph === 3 ? 7 : 10; addText('反射結界！', e.x, e.y - d.h - 30, '#e0d0ff', 30); SFX.shield(); }
    }
    e.atk -= dt * sm;
    if (e.atk <= 0 && e.patrol) { e.atk = ph === 1 ? 2.4 : ph === 2 ? 2.0 : 1.4; e.swing = 0.4; shoot(e, 'orb'); }
    if (e.sumT <= 0) {
      e.sumT = ph === 3 ? 12 : 15;
      const wave = ph === 1 ? ['bandit', 'bandit', 'shield'] : ph === 2 ? ['assassin', 'assassin', 'shaman'] : ['ram', 'harpy', 'harpy'];
      wave.forEach((t, i) => spawn(t, false, W + 40 + i * 50));
      addText('召喚！', e.x, e.y - d.h - 30, '#c08aff', 28);
    }
  }
}

function shoot(e, kind) {
  const d = ENEMY[e.type];
  const sx = e.x - (d.boss ? 70 : 22), sy = e.y - (d.boss === 1 ? 120 : d.boss ? 70 : 30);
  const tx = WALL_X - 10 - Math.random() * 50, ty = 420 + Math.random() * 140;
  const dmg = d.boss ? d.dmg : d.dmg * G.dmgMul;
  // 樹根：沿著地面竄向城牆
  if (kind === 'root') { const x0 = e.x - 60, t = 1.8; G.shots.push({ kind, x: x0, y: 600, vx: (WALL_X - x0) / t, vy: 0, g: 0, dmg }); return; }
  if (kind === 'orb' || kind === 'drain' || kind === 'water' || kind === 'ink') {
    const t = kind === 'ink' ? 1.9 : 1.6;
    G.shots.push({ kind, x: sx, y: sy, vx: (tx - sx) / t, vy: (ty - sy) / t, g: 0, dmg: kind === 'ink' ? dmg * 0.5 : dmg }); return;
  }
  const t = kind === 'arrow' ? 0.9 : 1.2, g = kind === 'breath' ? 250 : 600;
  G.shots.push({ kind, x: sx, y: sy, vx: (tx - sx) / t, vy: (ty - sy) / t - 0.5 * g * t, g, dmg });
}

function updateShots(dt) {
  for (const a of G.shots) {
    a.vy += a.g * dt; a.x += a.vx * dt; a.y += a.vy * dt;
    if (a.kind === 'breath' && Math.random() < 0.7) G.fx.push({ type: 'p', x: a.x, y: a.y, vx: 0, vy: 0, g: -80, size: 10, color: Math.random() < 0.5 ? '#ff7a3d' : '#ffe36b', life: 0.3, max: 0.3 });
    if (a.kind === 'root' && G.fx.length < 380 && Math.random() < 0.5) G.fx.push({ type: 'p', x: a.x, y: 604, vx: (Math.random() - 0.5) * 60, vy: -120, g: 500, size: 6, color: Math.random() < 0.5 ? '#8a5a32' : '#5ac85a', life: 0.4, max: 0.4 });
    if (a.x <= WALL_X) {
      a.done = true;
      // 鏡之結界：把飛來的攻擊反彈給敵人（地底的樹根彈不回去）
      if (G.mirrorT > 0 && a.kind !== 'root') {
        const t = nearestEnemy(WALL_X + 200, a.y, 2000);
        if (t) G.feathers.push({ x: WALL_X + 30, y: a.y, id: t.id, dmg: G.mirrorDmg + a.dmg * 3, life: 3, kind: 'mirror' });
        burst(WALL_X + 24, a.y, 8, ['#bfe8ff', '#ffffff'], 200, 0, 5, 0.4);
        SFX.shield();
        continue;
      }
      // 吸魔女巫的紫光：不傷城堡，吸走魔力
      if (a.kind === 'drain') {
        const lost = Math.min(G.mp, 12);
        G.mp -= lost; G.mpFlash = 0.4;
        addText('-' + Math.round(lost) + ' 魔力', WIZ.x + 70, WIZ.y - 150, '#c9a0ff', 24);
        burst(WALL_X, a.y, 8, ['#7be38a', '#c9a0ff'], 180, 0, 5, 0.4);
        SFX.fizzle();
        continue;
      }
      hitCastle(a.dmg);
      if (a.kind === 'ink') {
        G.inkT = 4; G.inkBlobs = [];
        for (let i = 0; i < 7; i++) G.inkBlobs.push({ x: 160 + Math.random() * 960, y: 120 + Math.random() * 420, r: 60 + Math.random() * 70 });
        addText('墨汁！', 640, 300, '#3a2a4a', 40);
        SFX.blast(); continue;
      }
      if (a.kind === 'root') { G.shake = Math.max(G.shake, 8); burst(WALL_X, 590, 14, ['#8a5a32', '#5ac85a', '#ffffff'], 240, 500, 7, 0.5); SFX.quake(); continue; }
      if (a.kind !== 'arrow') { burst(WALL_X, a.y, 10, a.kind === 'orb' ? ['#9a5aff', '#e0d0ff'] : a.kind === 'water' ? ['#4fb8ff', '#bfe8ff', '#ffffff'] : ['#ff7a3d', '#ffe36b', '#3a3550'], 220, 300, 7, 0.5); SFX.blast(); }
    }
  }
  G.shots = G.shots.filter(a => !a.done);
}

function updateMagic(dt) {
  // 影子分身：跟著再放一次
  if (G.clone) {
    const c = G.clone;
    c.t -= dt; c.age += dt; c.cast = Math.max(0, c.cast - dt);
    if (c.t <= 0) { burst(CLONE_POS.x, CLONE_POS.y - 60, 16, ['#b05aff', '#2b1f48', '#ffffff'], 200, 0, 6, 0.5); G.clone = null; G.cloneQ = []; }
  }
  for (const q of G.cloneQ) {
    q.t -= dt;
    if (q.t > 0) continue;
    q.done = true;
    if (G.clone && useSpell(q.id, q.x, q.y, true, false, q.pow)) G.clone.cast = 0.28;
  }
  G.cloneQ = G.cloneQ.filter(q => !q.done);
  // 中毒
  G.psnTick -= dt;
  if (G.psnTick <= 0) {
    G.psnTick = 0.5;
    for (const e of G.enemies) {
      if (e.dead || !(e.psn > 0)) continue;
      e.psn -= 0.5;
      damage(e, e.psnDps * 0.5, 'poison');
      if (e.psn <= 0) e.psnDps = 0;
    }
  }
  if (G.mirrorT > 0) G.mirrorT -= dt;
  if (G.inkT > 0) G.inkT -= dt;
  // 樹王的祝福：持續修復城堡
  if (G.bless) {
    const b = G.bless;
    b.t -= dt; b.leaf -= dt;
    G.castleHp = Math.min(G.castleMax, G.castleHp + G.castleMax * b.rate * dt);
    if (b.leaf <= 0 && G.fx.length < 380) { b.leaf = 0.15; G.fx.push({ type: 'p', x: 30 + Math.random() * 220, y: 380 + Math.random() * 220, vx: 20, vy: -50, g: -20, size: 6, color: Math.random() < 0.5 ? '#7be38a' : '#ffffff', life: 0.9, max: 0.9 }); }
    if (b.t <= 0) G.bless = null;
  }
  // 潮汐巨浪
  for (const w of G.waves) {
    w.x += 760 * dt;
    for (const e of G.enemies) {
      const d = ENEMY[e.type];
      if (e.dead || d.air || e.charm > 0 || w.hit.has(e.id) || Math.abs(e.x - w.x) > 70) continue;
      w.hit.add(e.id);
      damage(e, w.dmg, 'wave');
      e.wet = 6;
      if (!e.dead && !d.boss && e.type !== 'tentacle') e.x = Math.max(e.x, Math.min(W - 10, e.x + w.push * (d.heavy ? 0.4 : 1)));
    }
    if (G.fx.length < 380) G.fx.push({ type: 'p', x: w.x + 20, y: 560 + Math.random() * 50, vx: 220, vy: -160, g: 600, size: 7, color: Math.random() < 0.5 ? '#bfe8ff' : '#ffffff', life: 0.5, max: 0.5 });
    if (w.x > W + 80) w.done = true;
  }
  G.waves = G.waves.filter(w => !w.done);
  // 召喚鯨魚
  for (const w of G.whales) {
    w.t += dt;
    if (!w.hit && w.t >= w.dur) {
      w.hit = true;
      for (const e of G.enemies) {
        if (e.dead || e.charm > 0 || Math.abs(e.x - w.x) > w.R + ENEMY[e.type].r * 0.5) continue;
        damage(e, w.dmg, 'whale');
        if (!e.dead) { applyStun(e, 1.5); e.wet = 6; }
      }
      G.fx.push({ type: 'ring', x: w.x, y: 540, r: w.R, life: 0.5, max: 0.5, color: '#62a8ff' });
      burst(w.x, 600, 36, ['#bfe8ff', '#ffffff', '#4fb8ff'], 480, 700, 9, 0.8);
      G.shake = Math.max(G.shake, 14); SFX.boom();
    }
    if (w.t > w.dur + 0.9) w.done = true;
  }
  G.whales = G.whales.filter(w => !w.done);
  // 火球
  for (const p of G.projs) {
    const dx = p.tx - p.x, dy = p.ty - p.y, dist = Math.hypot(dx, dy), step = 1400 * dt;
    if (dist <= step) { p.done = true; explode(p.tx, p.ty, p.R, p.dmg, false, p.kind); }
    else { p.x += dx / dist * step; p.y += dy / dist * step; }
    if (G.fx.length < 380) G.fx.push({ type: 'p', x: p.x, y: p.y, vx: (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 40, g: -60, size: 6, color: Math.random() < 0.5 ? '#ffb03d' : '#ffe36b', life: 0.25, max: 0.25 });
  }
  G.projs = G.projs.filter(p => !p.done);
  // 冰刺
  for (const s of G.spikes) {
    s.delay -= dt;
    if (s.delay > 0) continue;
    s.done = true;
    G.fx.push({ type: 'spike', x: s.x, y: 618, life: 0.6, max: 0.6 });
    for (const e of G.enemies) {
      if (e.dead || ENEMY[e.type].air || s.hit.has(e.id) || Math.abs(e.x - s.x) > 30) continue;
      s.hit.add(e.id); damage(e, s.dmg, 'ice'); e.slow = Math.max(e.slow, s.slowT);
    }
  }
  G.spikes = G.spikes.filter(s => !s.done);
  // 隕石
  for (const m of G.meteors) {
    if (m.delay > 0) { m.delay -= dt; continue; }
    m.t += dt;
    if (m.t >= 0.5) { m.done = true; explode(m.tx, 600, 60, m.dmg, true); }
  }
  G.meteors = G.meteors.filter(m => !m.done);
  // 星光飛彈（追蹤）
  for (const m of G.missiles) {
    if (m.delay > 0) { m.delay -= dt; continue; }
    m.life -= dt;
    let t = m.tid >= 0 ? G.enemies.find(e => e.id === m.tid && !e.dead) : null;
    if (!t) { t = nearestEnemy(m.tx, m.ty, 600) || nearestEnemy(m.x, m.y, 1400); m.tid = t ? t.id : -1; }
    if (!t || m.life <= 0) { m.done = true; continue; }
    const dx = t.x - m.x, dy = cy(t) - m.y, dist = Math.hypot(dx, dy) || 1, k = Math.min(1, 7 * dt);
    m.vx += (dx / dist * 950 - m.vx) * k; m.vy += (dy / dist * 950 - m.vy) * k;
    m.x += m.vx * dt; m.y += m.vy * dt;
    if (dist < 24) { m.done = true; damage(t, m.dmg, 'missile'); burst(m.x, m.y, 5, ['#fff07a', '#ffffff'], 160, 0, 4, 0.3); }
  }
  G.missiles = G.missiles.filter(m => !m.done);
  // 薑餅巨人：擋路，並揮拳打前方一群地面敵人
  if (G.wall) {
    const w = G.wall;
    w.t -= dt; w.swing = Math.max(0, w.swing - dt * 3); w.atk -= dt;
    if (w.atk <= 0) {
      const inRange = G.enemies.filter(e => !e.dead && !e.stealth && !ENEMY[e.type].air && e.x >= w.x - 10 && e.x <= w.x + 140);
      if (inRange.length) {
        w.atk = 1; w.swing = 1;
        for (const e of inRange) damage(e, w.dmg, 'giant');
        burst(w.x + 70, 590, 6, ['#c98a4a', '#fff6e8'], 200, 400, 5, 0.4);
        G.shake = Math.max(G.shake, 3); SFX.boom();
      } else w.atk = 0.2;
    }
    if (w.hp <= 0 || w.t <= 0) {
      burst(w.x, 540, 24, ['#c98a4a', '#fff6e8', '#ff8fc8'], 300, 500, 8, 0.7);
      SFX.crack(); G.wall = null;
    }
  }

}

function updateFx(dt) {
  for (const f of G.fx) {
    f.life -= dt;
    if (f.type === 'p' || f.type === 'fstar') { f.vy += (f.g || 0) * dt; f.x += f.vx * dt; f.y += f.vy * dt; }
    else if (f.type === 'conf') { f.x += (f.vx + Math.sin(f.rot) * 40) * dt; f.y += f.vy * dt; f.rot += f.vr * dt; }
    else if (f.type === 'coin') {
      if (f.max - f.life < 0.4) { f.vy += 700 * dt; f.x += f.vx * dt; f.y += f.vy * dt; }
      else {
        const k = 1 - Math.exp(-9 * dt);
        f.x += (COIN_POS.x - f.x) * k; f.y += (COIN_POS.y - f.y) * k;
        if (Math.hypot(COIN_POS.x - f.x, COIN_POS.y - f.y) < 16) { f.life = 0; G.goldBump = 0.25; SFX.coin(); }
      }
    }
  }
  G.fx = G.fx.filter(f => f.life > 0);
  for (const t of G.texts) { t.life -= dt; t.y -= 40 * dt; }
  G.texts = G.texts.filter(t => t.life > 0);
}

function finish(win) {
  G.over = win ? 'win' : 'lose'; G.overT = 0; P.down = false;
  const res = { gold: G.gold, bonus: 0, levelUp: null, learned: [], equipped: [], newSlot: false, spGain: 0 };
  if (win) {
    const ratio = G.castleHp / G.castleMax;
    G.stars = ratio >= 0.8 ? 3 : ratio >= 0.45 ? 2 : 1;
    const from = heroLv(), spBefore = spInfo().total, slotsBefore = slotsFor(from);
    const first = G.stage > save.cleared;
    res.bonus = Math.round((20 + 5 * G.stage) * (first ? 2 : 1));
    if (first) save.cleared = G.stage;
    save.stars[G.stage] = Math.max(save.stars[G.stage] || 0, G.stars);
    const to = heroLv();
    if (to > from) {
      res.levelUp = { from, to };
      res.learned = SPELLS.filter(s => s.unlock > from && s.unlock <= to);
      res.newSlot = slotsFor(to) > slotsBefore;
      const before = [...save.loadout];
      normalizeLoadout(true);
      // 打敗第 20 關的黑翼飛龍：牠直接成為夥伴，放進出戰欄
      if (G.stage === 20) { equipDragon(); save.seen.dragonOath = true; }
      res.equipped = save.loadout.filter(id => !before.includes(id));
      SFX.levelup();
    }
    res.spGain = spInfo().total - spBefore;
    SFX.win();
    if (STORY['post' + G.stage] && !save.seen['post' + G.stage]) G.postStory = 'post' + G.stage;
    const colors = ['#ff8fb8', '#ffd84d', '#7be35a', '#62cfff', '#a98bff'];
    for (let i = 0; i < 90; i++) G.fx.push({ type: 'conf', x: Math.random() * W, y: -20 - Math.random() * 320, vx: (Math.random() - 0.5) * 80,
      vy: 120 + Math.random() * 160, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10, color: colors[i % 5], life: 4, max: 4 });
  } else SFX.lose();
  save.gold += res.gold + res.bonus;
  writeSave();
  G.result = res;
}

function jagged(pts) {
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
    const seg = Math.max(3, Math.floor(len / 40));
    for (let k = 1; k < seg; k++) { const off = (Math.random() - 0.5) * 26; out.push({ x: a.x + dx * k / seg + nx * off, y: a.y + dy * k / seg + ny * off }); }
    out.push(b);
  }
  return out;
}
function drawFx() {

      case 'ring': ctx.globalAlpha = a; circ(f.x, f.y, f.r * (1.1 - a * 0.6)); ctx.lineWidth = 8 * a + 2; ctx.strokeStyle = f.color; ctx.stroke(); break;

      case 'pop': {

        for (let i = 0; i < 5; i++) { const an = i * Math.PI * 2 / 5 - Math.PI / 2; drawStar(f.x + Math.cos(an) * 30 * p, f.y + Math.sin(an) * 30 * p, 6, '#ffe14d', OUT, 2); }

        ctx.beginPath(); ctx.moveTo(f.x - 14, f.y); ctx.lineTo(f.x - 2, f.y - h); ctx.lineTo(f.x + 12, f.y); ctx.closePath(); fillStroke('#a8e6ff', 3, '#2f7fb0');
        ctx.beginPath(); ctx.moveTo(f.x - 6, f.y - 4); ctx.lineTo(f.x - 2, f.y - h + 10); ctx.lineWidth = 2.5; ctx.strokeStyle = '#ffffff'; ctx.stroke();
        break;
      }
      case 'shard': { const p = 1 - a; drawSpellIcon('ice', f.x0 + (f.x1 - f.x0) * p, f.y0 + (f.y1 - f.y0) * p, 0.6); break; }

      case 'quake':

function button(x, y, w, h, label, fn, opt = {}) {
  const hov = !opt.disabled && P.mouse && P.x >= x && P.x <= x + w && P.y >= y && P.y <= y + h;
  const lift = hov ? -3 : 0;
  rrect(x, y + 6, w, h, h / 2.6); ctx.fillStyle = 'rgba(58,42,74,.35)'; ctx.fill();
  rrect(x, y + lift, w, h, h / 2.6); fillStroke(opt.disabled ? '#c9bfd3' : (opt.color || '#ffb84d'), 4);
  rrect(x + 10, y + lift + 6, w - 20, h * 0.32, h * 0.16); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fill();
  txt(label, x + w / 2, y + lift + h / 2 + 2, opt.size || 30, '#fff', 'center', 6);
  if (!opt.disabled) buttons.push({ x, y, w, h, fn });
}
function iconButton(cx, cyy, r, draw, fn) {
  circ(cx, cyy + 4, r); ctx.fillStyle = 'rgba(58,42,74,.35)'; ctx.fill();
  circ(cx, cyy, r); fillStroke('#fff6e8', 4);
  draw(cx, cyy);
  buttons.push({ x: cx - r, y: cyy - r, w: r * 2, h: r * 2, fn });
}
function soundButton(cx, cyy) {
  iconButton(cx, cyy, 26, (x, y) => {
    ctx.fillStyle = OUT;
    ctx.beginPath(); ctx.moveTo(x - 12, y - 5); ctx.lineTo(x - 5, y - 5); ctx.lineTo(x + 3, y - 12); ctx.lineTo(x + 3, y + 12); ctx.lineTo(x - 5, y + 5); ctx.lineTo(x - 12, y + 5); ctx.closePath(); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.lineCap = 'round';
    if (save.muted) { ctx.beginPath(); ctx.moveTo(x + 7, y - 6); ctx.lineTo(x + 15, y + 6); ctx.moveTo(x + 15, y - 6); ctx.lineTo(x + 7, y + 6); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(x + 4, y, 8, -0.8, 0.8); ctx.stroke(); ctx.beginPath(); ctx.arc(x + 4, y, 14, -0.8, 0.8); ctx.stroke(); }
  }, () => { save.muted = !save.muted; writeSave(); });
}
function musicButton(cx, cyy) {
  iconButton(cx, cyy, 26, (x, y) => {

function goFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req || document.fullscreenElement) return;
  try {
    const p = req.call(el);
    if (p && p.then) p.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {});
  } catch (e) {}
}

// ============================================================
//  輸入
// ============================================================
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  const p = toLogical(e);
  P.x = p.x; P.y = p.y; P.mouse = e.pointerType === 'mouse';
  for (let i = buttons.length - 1; i >= 0; i--) {
    const b = buttons[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { SFX.click(); b.fn(); return; }
  }
  if (state === 'story') { advanceStory(); return; }
  if (state === 'play' && G && !G.paused && !G.over && !inHud(p.x, p.y)) {
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    P.down = true; P.onField = true;
    useSpell(G.sel, p.x, p.y, false);
  }
});
cv.addEventListener('pointermove', e => {
  const p = toLogical(e);
  P.x = p.x; P.y = p.y; P.mouse = e.pointerType === 'mouse';
  if (P.down && G) P.onField = !inHud(p.x, p.y);
});
const release = () => { P.down = false; P.onField = false; };
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { P.x = -1; release(); } });
// 開選檔視窗、下載檔案要等「點擊完成」才能做（手機按下去的當下瀏覽器不允許）
cv.addEventListener('click', () => { if (afterTap) { const f = afterTap; afterTap = null; f(); } });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (state === 'story') { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); advanceStory(); } return; }
  if (state !== 'play' || !G || G.over) return;
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { G.paused = !G.paused; return; }
  if (G.paused) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 8 && G.loadout[n - 1]) pressSpell(G.loadout[n - 1]);
  if (e.key === 'q' || e.key === 'Q' || e.key === ' ') { e.preventDefault(); useSpell('starfall', null, null, false); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play' && G && !G.over) G.paused = true; });

// ============================================================
//  主迴圈
// ============================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  if (isTouch && window.innerHeight > window.innerWidth && state === 'play' && G && !G.over) G.paused = true;
  buttons = [];
  if (state === 'story' && !story) goState('select');
  if (state === 'play') update(dt);
  else if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; }
  if (state === 'story') story.shown += dt * 30;
  setMusic(state === 'story' ? story.sc.music
    : state === 'play' ? (G.over ? null : G.boss ? 'boss' : ['grass', 'snow', 'volcano', 'sky', 'void', 'crystal', 'forest', 'ocean'][G.ch])
    : 'title');
  ctx.setTransform(K, 0, 0, K, 0, 0);
  if (state === 'title') renderTitle();
  else if (state === 'select') renderSelect();
  else if (state === 'book') renderBook();
  else if (state === 'saves') renderSaves();
  else if (state === 'shop') renderShop();
  else if (state === 'story') renderStory();
  else renderPlay();
  if (transT > 0) { ctx.fillStyle = `rgba(42,31,61,${transT / 0.35})`; ctx.fillRect(0, 0, W, H); transT -= dt; }
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
initCloud();

// 除錯／自動測試用
window.__wtd = { startLevel, enterLevel, playStory, update, useSpell, spawn, go: s => { state = s; }, get story() { return story; }, Music, get G() { return G; }, get save() { return save; }, set save(v) { save = v; },
  normalizeLoadout, spInfo, heroLv, upgradeCost, applySave, saveFileText, parseSaveFile, fileInput, get pendingImport() { return pendingImport; }, confirmImport, SPELLS, SPELL, ENEMY, LEVELS, LEVEL_HP, BAL, UPGRADES, STORY };
})();
