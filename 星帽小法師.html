  :root{--bg:#2a1f3d;--fg:#ffffff;--accent:#ffe46b;color-scheme:dark;}
  html{height:100%;box-sizing:border-box;background:var(--bg);overflow:hidden;}
  body{margin:0;height:100%;box-sizing:border-box;overflow:hidden;background:var(--bg);color:var(--fg);
    padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
    display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  canvas{display:block;touch-action:none;}
  #rotate{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);color:var(--fg);font:900 22px "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;text-align:center;z-index:5;}
  #rotate .phone{width:56px;height:96px;border:6px solid var(--accent);border-radius:14px;animation:rot 1.8s ease-in-out infinite;}
  @media (prefers-reduced-motion:reduce){#rotate .phone{animation:none;transform:rotate(-90deg);}}
  @keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
</style>
</head>

const SAVE_KEY = 'starhat_wizard_td_v1';
const defSave = () => ({
  cleared: 0, stars: {}, gold: 0, muted: false, musicOff: false,
  upgrades: { wall: 0, crystal: 0, spring: 0, owl: 0, thorns: 0 },
  ranks: {}, loadout: [], seen: {},
});
let save = defSave();
// 把讀到的存檔（本機或雲端）套用成目前進度；t 是最後存檔時間，用來判斷哪份比較新
function applySave(s) {
  if (!s || typeof s.cleared !== 'number') return false;
  save = Object.assign(defSave(), s);
  save.upgrades = Object.assign(defSave().upgrades, s.upgrades || {});
  save.stars = Object.assign({}, s.stars); save.ranks = Object.assign({}, s.ranks); save.seen = Object.assign({}, s.seen);
  const needFill = !Array.isArray(s.loadout);
  save.loadout = needFill ? [] : [...s.loadout];
  normalizeLoadout(needFill);
  return true;
}
try { applySave(JSON.parse(localStorage.getItem(SAVE_KEY))); } catch (e) {}
normalizeLoadout(!save.loadout.length);
function writeSave() {
  save.t = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
  scheduleCloud();
}

// 雲端存檔：在 claude.ai 開啟時，每位玩家在 data/users/<id>/save 各存一份（別人看不到），電腦和手機共用
const Cloud = { ref: null, busy: false, pending: false, timer: 0 };
async function initCloud() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc('data/users/' + uid + '/save');
    const snap = await ref.get();
    const remote = snap.exists ? snap.data() : null;
    Cloud.ref = ref;
    if (remote && (remote.t || 0) > (save.t || 0) && applySave(remote)) {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
      showToast('已載入雲端存檔（第 ' + save.cleared + ' 關）');
    } else if (save.t) cloudWrite();
  } catch (e) { Cloud.ref = null; }
}
function scheduleCloud() {
  if (!Cloud.ref) return;
  clearTimeout(Cloud.timer);
  Cloud.timer = setTimeout(cloudWrite, 1200);
}
async function cloudWrite() {
  if (!Cloud.ref) return;
  if (Cloud.busy) { Cloud.pending = true; return; }
  Cloud.busy = true;
  try { await Cloud.ref.set(JSON.parse(JSON.stringify(save))); }
  catch (e) { if (!e || e.code !== 'unavailable') Cloud.ref = null; }
  Cloud.busy = false;
  if (Cloud.pending) { Cloud.pending = false; cloudWrite(); }
}

function heroLv() { return Math.min(MAX_STAGE, save.cleared + 1); }
function slotsFor(lv) { return lv >= 14 ? 5 : lv >= 6 ? 4 : 3; }
function learned(id) { return heroLv() >= SPELL[id].unlock; }
function rankOf(id) { return save.ranks[id] || 1; }
function spInfo() {
  const total = (heroLv() - 1) + Object.values(save.stars).filter(s => s >= 3).length;
  const spent = Object.values(save.ranks).reduce((a, r) => a + Math.max(0, r - 1), 0);
  return { total, spent, free: total - spent };
}
// fill：把已學會但沒裝備的魔法自動放進空欄位
function normalizeLoadout(fill) {
  const lv = heroLv(), slots = slotsFor(lv);
  let lo = [...new Set((save.loadout || []).filter(id => SPELL[id] && SPELL[id].type !== 'ult' && learned(id)))];
  if (fill) for (const s of SPELLS) if (s.type !== 'ult' && learned(s.id) && !lo.includes(s.id) && lo.length < slots) lo.push(s.id);
  lo = lo.slice(0, slots);
  if (!lo.length) lo = ['fire'];
  save.loadout = lo;
}

// ============================================================
let AC = null, noiseBuf = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type = 'sine', vol = 0.12, slide = 0, delay = 0) {
  if (!AC || save.muted) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function ensureNoise() {
  if (noiseBuf) return;
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function noise(dur, vol = 0.15, freq = 1200, delay = 0) {
  if (!AC || save.muted) return;
  ensureNoise();
  const t0 = AC.currentTime + delay;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  src.connect(f).connect(g).connect(AC.destination); src.start(t0, Math.random() * 0.4, Math.min(dur, 0.6));
}

let state = 'title';   // title | select | book | shop | story | play
let G = null;
let T = 0;
let buttons = [];
let resetArmed = 0, respecArmed = 0;
let bookSel = 'fire';

let story = null;      // { id, sc, i, shown, onDone }
const P = { x: -1, y: -1, mouse: false, down: false, onField: false };

function showToast(s) { toast = { s, t: 2 }; }
function goState(s) { state = s; transT = 0.35; P.down = false; }

function enterLevel(n) {
  const id = 'pre' + n;
  if (STORY[id] && !save.seen[id]) playStory(id, () => startLevel(n));
  else startLevel(n);
}
function playStory(id, onDone) {
  story = { id, sc: STORY[id], i: 0, shown: 0, onDone };
  save.seen[id] = true; writeSave();
  goState('story');
}
function advanceStory() {
  if (!story) return;
  const text = story.sc.lines[story.i][1];
  if (story.shown < text.length) { story.shown = text.length; return; }
  story.i++; story.shown = 0;
  if (story.i >= story.sc.lines.length) endStory();
}
function endStory() {
  if (!story) return;
  const done = story.onDone;
  story = null; done();
}
function chapterOf(n) { return Math.min(2, Math.floor((n - 1) / 10)); }

function startLevel(n) {
  const L = LEVELS[n - 1], lv = heroLv(), u = save.upgrades;
  const queue = [];
  for (const [t0, type, cnt, iv] of L.groups) for (let i = 0; i < cnt; i++) queue.push({ t: t0 + i * iv, type });
  queue.sort((a, b) => a.t - b.t);
  normalizeLoadout(false);
  const mpMax = BAL.mpBase + BAL.mpPerLv * (lv - 1) + BAL.crystalMp * u.crystal;
  const castleMax = Math.round(BAL.castle * (1 + BAL.wallPct * u.wall));
  G = {
    stage: n, L, ch: chapterOf(n), t: 0, queue, total: queue.length,
    enemies: [], projs: [], shots: [], spikes: [], meteors: [], zones: [], feathers: [], fx: [], texts: [],
    castleMax, castleHp: castleMax, barrier: 0, barrierT: 0,
    mpMax, mp: mpMax, mpRegen: BAL.regenBase + BAL.regenPerLv * (lv - 1) + BAL.springRegen * u.spring,
    power: 1 + BAL.powerPerLv * (lv - 1),
    hpMul: 1 + BAL.hpPerStage * (n - 1), dmgMul: 1 + BAL.dmgPerStage * (n - 1), goldMul: BAL.goldScale * (1 + BAL.goldPerStage * (n - 1)),
    loadout: [...save.loadout], sel: save.loadout.find(id => SPELL[id].type === 'target') || 'fire',
    cds: {}, ultUsed: false,
    owlLv: u.owl, owlT: 1, owlAnim: 0, thorns: BAL.thornsDmg * u.thorns,
    timeStop: 0, blizzard: 0, blizDps: 0, blizTick: 0, starfall: null,
    castAnim: 0, shake: 0, castleFlash: 0, noMpT: 0, reflectT: 0,
    gold: 0, kills: 0, over: null, overT: 0, paused: false, hintT: 7, nextId: 1,
    introT: 2.4, goldBump: 0, mpFlash: 0, castColor: '#ffd84d', postStory: null,
    boss: null, bossIntro: 0, stars: 0, result: null,
  };
  for (const s of SPELLS) G.cds[s.id] = 0;
  P.down = false;
  goState('play');
}

function spawn(type, fromQueue, x) {
  const d = ENEMY[type];
  const hp = Math.round(d.boss ? d.hp : d.hp * G.hpMul);
  let y;
  if (d.boss === 2) y = 250; else if (d.boss === 3) y = 330;
  else if (d.air) y = d.fly[0] + Math.random() * (d.fly[1] - d.fly[0]);
  else y = GROUND - 8 + Math.random() * 28;
  const e = {
    id: G.nextId++, type, q: !!fromQueue, x: x != null ? x : W + 40 + Math.random() * 40, y, baseY: y,
    hp, max: hp, atk: 0.3 + Math.random() * 0.5, walk: Math.random() * 50, age: Math.random() * 10,
    slow: 0, stun: 0, frz: 0, flash: 0, swing: 0, kb: 0, dead: false, stealth: !!d.stealth, dash: false,
    stopX: d.range ? WALL_X + d.range + (d.boss ? 0 : Math.random() * 140) : WALL_X + (d.reach || d.r) + Math.random() * 16,
    phase: 1, sumT: 9, mirT: 7, mirror: 0, pt: 0, patrol: false, blockT: 0,
  };
  if (d.boss) { e.x = W + 120; G.boss = e; G.bossIntro = 2.5; G.shake = 12; SFX.roar(); }
  G.enemies.push(e);
  return e;
}

function addText(s, x, y, color, size = 24) {
  if (G.texts.length > 60) G.texts.shift();
  G.texts.push({ s: String(s), x, y, color, size, life: 0.8, max: 0.8 });
}
function burst(x, y, n, colors, spd = 200, g = 400, size = 5, life = 0.6) {
  if (G.fx.length > 380) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.3 + Math.random() * 0.7);
    G.fx.push({ type: 'p', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g, size: size * (0.6 + Math.random() * 0.6),
      color: colors[i % colors.length], life: life * (0.6 + Math.random() * 0.5), max: life });
  }
}
function msg(s) { if (G.noMpT <= 0) { addText(s, WIZ.x + 60, WIZ.y - 180, '#ffffff', 24); G.noMpT = 0.6; } }

// 敵人身體中心
const cy = e => e.y - ENEMY[e.type].h * 0.45;
function nearestEnemy(x, y, maxD) {
  let best = null, bd = maxD;
  for (const e of G.enemies) {
    if (e.dead || e.stealth) continue;
    const d = Math.hypot(e.x - x, cy(e) - y);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}
function applyStun(e, t) {
  const d = ENEMY[e.type];
  if (d.heavy) return;
  e.stun = Math.max(e.stun, d.boss ? t * 0.3 : t);
}

const DMG_COLOR = { fire: '#ffb03d', ice: '#a8ecff', bolt: '#fff36b', meteor: '#ff9a3d', owl: '#f2dcc0', star: '#ffe46b', bomb: '#ff8a5a', thorns: '#c4cbe0' };
function damage(e, amt, kind) {
  if (e.dead) return;
  const d = ENEMY[e.type];
  if (d.boss === 3 && e.mirror > 0 && kind !== 'star') {
    if (G.reflectT <= 0) { G.reflectT = 0.25; addText('反射！', e.x, e.y - 170, '#e0d0ff', 26); hitCastle(4); }
    return;
  }
  if (d.shield && (kind === 'fire' || kind === 'owl')) {
    amt *= 0.3;
    if (e.blockT <= 0) { e.blockT = 0.5; addText('格擋', e.x + 6, e.y - d.h - 30, '#d5dcef', 20); }
  }

  if (kind !== 'flame' && kind !== 'blizzard') addText(Math.max(1, Math.round(amt)), e.x + (Math.random() - 0.5) * 20, e.y - d.h, DMG_COLOR[kind] || '#fff', d.boss ? 30 : 24);
  if (e.hp <= 0) kill(e);
}
function kill(e, opt = {}) {

  }
  burst(e.x, cy(e), d.boss ? 40 : 12, ['#ffffff', '#f0e6ff', '#ffd84d'], d.boss ? 400 : 220, 200, d.boss ? 12 : 7, 0.6);
  G.fx.push({ type: 'pop', x: e.x, y: cy(e), life: 0.35, max: 0.35 });
  G.fx.push({ type: 'die', e: Object.assign({}, e), life: d.boss ? 1.2 : 0.4, max: d.boss ? 1.2 : 0.4 });
  if (d.splits) for (const off of [-14, 18]) { const s = spawn('slimelet', false, e.x + off); s.y = s.baseY = Math.min(622, Math.max(592, e.y + (Math.random() - 0.5) * 10)); }
  if (d.bomber && !opt.self) {

    burst(e.x, cy(e), 14, ['#ff7a3d', '#3a3550', '#ffe36b'], 260, 300, 7, 0.5);
    SFX.blast();
    for (const o of G.enemies) if (!o.dead && o !== e && Math.hypot(o.x - e.x, o.y - e.y) < 75) damage(o, 45 * G.hpMul, 'bomb');
  }
  if (d.boss) { G.boss = null; G.shake = 16; G.fx.push({ type: 'screen', life: 0.3, max: 0.3 }); SFX.thunder(); }
}
function hitCastle(dmg) {
  if (G.barrier > 0) {
    const a = Math.min(G.barrier, dmg); G.barrier -= a; dmg -= a;
    burst(WALL_X + 10, 470 + Math.random() * 100, 3, ['#c9a8ff', '#ffffff'], 120, 0, 5, 0.4);
    if (dmg <= 0) return;
  }
  G.castleHp = Math.max(0, G.castleHp - dmg);

  addText('-' + Math.round(dmg), WALL_X - 20 + Math.random() * 30, 440 + Math.random() * 100, '#ff6b6b', 24);
  burst(WALL_X, 470 + Math.random() * 100, 3, ['#f9dce8', '#e7b3c8'], 160, 500, 5, 0.5);
}

// ============================================================
//  施法
// ============================================================
function useSpell(id, x, y, silent) {
  const sp = SPELL[id];
  if (!G || G.over || G.paused || !sp || !learned(id)) return false;
  if (sp.type === 'ult') { if (G.ultUsed) { if (!silent) msg('每關只能用一次'); return false; } }
  else if (!G.loadout.includes(id)) return false;
  if (G.cds[id] > 0) return false;
  if (G.mp < sp.cost) { if (!silent) { msg('魔力不足！'); G.mpFlash = 0.5; SFX.fizzle(); } return false; }
  if (y != null) y = Math.min(y, GROUND + 30);
  let target = null;
  if (id === 'bolt' || id === 'thunder') {
    target = nearestEnemy(x, y, 170);
    if (!target) { if (!silent) msg('沒有目標'); return false; }
  }
  const r = rankOf(id), mul = G.power * (1 + BAL.rankBonus * (r - 1)), dmg = sp.dmg * mul;
  G.mp -= sp.cost; G.cds[id] = sp.cd; G.castAnim = 0.28; G.castColor = sp.color;
  const tip = staffTip();
  burst(tip.x, tip.y, 8, [sp.color, '#ffffff'], 140, 0, 5, 0.35);
  const gx = Math.max(WALL_X + 70, x || 0);
  switch (id) {
    case 'fire':
      G.projs.push({ x: tip.x, y: tip.y, tx: x, ty: y, dmg, R: 46 + 4 * (r - 1) });
      SFX.fire(); break;
    case 'ice': {
      const hit = new Set();
      G.fx.push({ type: 'shard', x0: tip.x, y0: tip.y, x1: gx - 60, y1: 616, life: 0.14, max: 0.14 });
      for (let i = 0; i < 8; i++) G.spikes.push({ x: gx - 60 + i * 45, delay: 0.14 + i * 0.05, hit, dmg, slowT: 3 + 0.5 * (r - 1) });
      SFX.ice(); break;
    }
    case 'bolt': castChain(target, dmg, 5 + Math.floor((r - 1) / 2)); break;
    case 'barrier':
      G.barrier = Math.max(G.barrier, Math.round(G.castleMax * 0.18 * (1 + 0.2 * (r - 1))));
      G.barrierT = 8;
      burst(140, 470, 20, ['#c9a8ff', '#ffffff'], 260, 0, 6, 0.6);
      SFX.shield(); break;
    case 'flamewall':
      G.zones.push({ kind: 'flame', x: Math.min(gx, W - 60), t: 5 + 0.5 * (r - 1), max: 5 + 0.5 * (r - 1), dps: dmg, tick: 0 });
      SFX.fire(); break;
    case 'heal': {
      const amt = Math.round(G.castleMax * 0.15 * (1 + 0.2 * (r - 1)));
      G.castleHp = Math.min(G.castleMax, G.castleHp + amt);
      addText('+' + amt, 140, 420, '#7be38a', 32);
      for (let i = 0; i < 16; i++) G.fx.push({ type: 'p', x: 30 + Math.random() * 220, y: 600 - Math.random() * 220, vx: 0, vy: -60, g: -40, size: 6, color: i % 2 ? '#7be38a' : '#ffffff', life: 0.9, max: 0.9 });
      SFX.heal(); break;
    }
    case 'frostnova': {
      const R = 120;
      for (const e of G.enemies) {
        if (e.dead || Math.hypot(e.x - x, cy(e) - y) > R + ENEMY[e.type].r) continue;
        damage(e, dmg, 'ice');
        if (!e.dead) { const ft = 1.6 + 0.3 * (r - 1); applyStun(e, ft); if (e.stun > 0) e.frz = e.stun; }
      }
      G.fx.push({ type: 'ring', x, y, r: R, life: 0.4, max: 0.4, color: '#9fe6ff' });
      burst(x, y, 22, ['#ffffff', '#bff0ff', '#62cfff'], 320, 100, 6, 0.6);
      SFX.freeze(); break;
    }
    case 'thunder':
      damage(target, dmg, 'bolt');
      if (!target.dead) applyStun(target, 1.2);
      G.fx.push({ type: 'bolt', pts: [{ x: target.x + 6, y: 40 }, { x: target.x, y: cy(target) }], life: 0.4, max: 0.4, w: 2 });
      G.fx.push({ type: 'cloud', x: target.x + 6, life: 0.7, max: 0.7 });
      G.fx.push({ type: 'screen', life: 0.15, max: 0.15 });
      burst(target.x, cy(target), 14, ['#fff36b', '#ffffff'], 300, 0, 6, 0.4);
      G.shake = Math.max(G.shake, 9);
      SFX.thunder(); break;
    case 'meteor': {
      const n = 6 + (r - 1);
      for (let i = 0; i < n; i++) G.meteors.push({ tx: Math.max(WALL_X + 50, gx + (Math.random() - 0.5) * 260), delay: i * 0.16, t: 0, dmg });
      SFX.fire(); break;
    }
    case 'timestop':
      G.timeStop = 3 + 0.5 * (r - 1);
      G.fx.push({ type: 'ring', x: 640, y: 360, r: 700, life: 0.6, max: 0.6, color: '#d0a8ff' });
      SFX.timestop(); break;
    case 'blizzard':
      G.blizzard = 6; G.blizDps = dmg; G.blizTick = 0;
      SFX.freeze(); break;
    case 'storm':
      G.zones.push({ kind: 'storm', x: Math.min(Math.max(x, WALL_X + 60), W - 60), t: 8, max: 8, iv: 0.7, timer: 0.4, dmg });
      SFX.zap(); break;
    case 'starfall':
      G.ultUsed = true;
      G.starfall = { t: 0, dmg, hit: false };
      SFX.star(); break;
  }
  return true;
}

function castChain(first, dmg, hits) {
  const pts = [{ x: first.x + 10, y: 60 }];
  const hit = new Set();
  let cur = first;
  for (let i = 0; i < hits && cur; i++) {
    hit.add(cur.id);
    pts.push({ x: cur.x, y: cy(cur) });
    damage(cur, dmg, 'bolt');
    if (!cur.dead) applyStun(cur, 0.6);
    burst(cur.x, cy(cur), 5, ['#fff36b', '#ffffff'], 200, 0, 4, 0.3);
    dmg *= 0.8;
    let nx = null, nd = 210;
    for (const e of G.enemies) {
      if (e.dead || e.stealth || hit.has(e.id)) continue;
      const d = Math.hypot(e.x - cur.x, e.y - cur.y);
      if (d < nd) { nd = d; nx = e; }
    }
    cur = nx;
  }
  G.fx.push({ type: 'bolt', pts, life: 0.32, max: 0.32 });
  G.fx.push({ type: 'cloud', x: first.x + 10, life: 0.6, max: 0.6 });
  G.fx.push({ type: 'screen', life: 0.1, max: 0.1 });
  G.shake = Math.max(G.shake, 5);
  SFX.zap();
}

function explode(x, y, R, dmg, groundOnly) {
  for (const e of G.enemies) {
    if (e.dead || (groundOnly && ENEMY[e.type].air)) continue;
    if (Math.hypot(e.x - x, (cy(e) - y) * 0.8) <= R + ENEMY[e.type].r * 0.5) damage(e, dmg, groundOnly ? 'meteor' : 'fire');
  }
  G.fx.push({ type: 'ring', x, y, r: R, life: 0.3, max: 0.3, color: '#ffb03d' });
  G.fx.push({ type: 'flash', x, y, r: R * 0.9, life: 0.15, max: 0.15 });
  burst(x, y, 12, ['#ff7a3d', '#ffb03d', '#ffe36b'], 260, 300, 7, 0.55);
  burst(x, y, 4, ['#9a8fae', '#c9bfd3'], 60, -80, 10, 0.9);
  G.shake = Math.max(G.shake, 3);
  SFX.boom();
}

// ============================================================
//  更新
// ============================================================
function update(dt) {
  if (!G || G.paused) return;
  updateFx(dt);
  if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; }
  if (G.over) {
    G.overT += dt;
    if (G.postStory && G.overT > 1.6) { const id = G.postStory; G.postStory = null; playStory(id, () => goState('play')); }
    return;
  }
  const frozen = G.timeStop > 0;
  if (frozen) G.timeStop = Math.max(0, G.timeStop - dt);
  else {
    G.t += dt;
    while (G.queue.length && G.queue[0].t <= G.t) spawn(G.queue.shift().type, true);
  }
  G.mp = Math.min(G.mpMax, G.mp + G.mpRegen * dt);
  for (const k in G.cds) if (G.cds[k] > 0) G.cds[k] = Math.max(0, G.cds[k] - dt);
  G.castAnim = Math.max(0, G.castAnim - dt);
  G.shake = Math.max(0, G.shake - 40 * dt);
  G.castleFlash -= dt; G.noMpT -= dt; G.hintT -= dt; G.reflectT -= dt; G.bossIntro -= dt; G.owlAnim -= dt;
  G.introT -= dt; G.goldBump = Math.max(0, G.goldBump - dt); G.mpFlash = Math.max(0, G.mpFlash - dt);
  if (G.barrierT > 0) { G.barrierT -= dt; if (G.barrierT <= 0) G.barrier = 0; }
  if (P.down && P.onField && SPELL[G.sel].type === 'target') useSpell(G.sel, P.x, P.y, true);

  if (!frozen) updateEnemies(dt);
  updateMagic(dt);
  if (!frozen) updateShots(dt);

  G.enemies = G.enemies.filter(e => !e.dead);
  if (G.castleHp <= 0) finish(false);
  else if (!G.queue.length && !G.enemies.length) finish(true);
}

function updateEnemies(dt) {
  for (const e of G.enemies) {
    if (e.dead) continue;
    const d = ENEMY[e.type];
    e.flash -= dt; e.blockT -= dt; e.age += dt; e.kb = Math.max(0, e.kb - 50 * dt);
    e.swing = Math.max(0, e.swing - dt); e.frz = Math.max(0, e.frz - dt);
    if (e.slow > 0) e.slow -= dt;
    if (G.blizzard > 0) e.slow = Math.max(e.slow, 0.3);
    if (e.stun > 0) { e.stun -= dt; continue; }
    if (d.boss) { bossUpdate(e, dt); continue; }
    const sm = e.slow > 0 ? (d.heavy ? 0.75 : 0.5) : 1;
    if (e.stealth && e.x < WALL_X + 420) {
      e.stealth = false; e.dash = true;
      burst(e.x, cy(e), 12, ['#2f3550', '#6a6a8a', '#ffffff'], 200, 0, 7, 0.5);
      addText('現形！', e.x, e.y - 100, '#ff8a8a', 22);
    }
    if (e.x > e.stopX) {
      const mv = d.speed * (e.dash ? 2 : 1) * sm * dt;
      e.x = Math.max(e.stopX, e.x - mv); e.walk += mv;
      if (d.air) e.y = e.baseY;
    } else {
      if (d.bomber) {
        hitCastle(d.dmg * G.dmgMul);
        G.fx.push({ type: 'ring', x: e.x, y: cy(e), r: 70, life: 0.3, max: 0.3, color: '#ff8a3d' });
        burst(e.x, cy(e), 14, ['#ff7a3d', '#3a3550', '#ffe36b'], 260, 300, 7, 0.5);
        SFX.blast();
        kill(e, { noGold: true, self: true });
        continue;
      }
      e.atk -= dt * sm;
      if (e.atk <= 0) {
        e.atk = d.atkCd; e.swing = 0.3;
        if (d.healer) shamanHeal(e);
        else if (d.range) shoot(e, 'arrow');
        else { hitCastle(d.dmg * G.dmgMul); if (G.thorns) damage(e, G.thorns, 'thorns'); }
      }
    }
  }
}

function shamanHeal(e) {
  let n = 0;
  for (const o of G.enemies) {
    if (o.dead || o === e || ENEMY[o.type].boss || o.hp >= o.max || Math.abs(o.x - e.x) > 180) continue;
    o.hp = Math.min(o.max, o.hp + o.max * 0.15); n++;
    burst(o.x, cy(o), 4, ['#7be38a', '#ffffff'], 80, -60, 5, 0.5);
  }
  if (n) { G.fx.push({ type: 'ring', x: e.x, y: cy(e), r: 180, life: 0.5, max: 0.5, color: '#7be38a' }); SFX.heal2(); }
}

function bossUpdate(e, dt) {
  const d = ENEMY[e.type], ratio = e.hp / e.max;
  const ph = d.boss === 3 ? (ratio > 0.66 ? 1 : ratio > 0.33 ? 2 : 3) : (ratio > 0.5 ? 1 : 2);
  if (ph !== e.phase) {
    e.phase = ph; G.shake = 12; SFX.roar();
    addText('狂暴化！', e.x, e.y - d.h - 20, '#ff5a5a', 34);
  }
  const sm = e.slow > 0 ? 0.75 : 1;
  e.sumT -= dt;
  if (d.boss === 1) {
    if (e.x > e.stopX) { const mv = d.speed * sm * dt; e.x = Math.max(e.stopX, e.x - mv); e.walk += mv; }
    else {
      e.atk -= dt * sm;
      if (e.atk <= 0) { e.atk = ph === 1 ? 2.6 : 1.7; e.swing = 0.4; shoot(e, 'bomb'); }
    }
    if (e.sumT <= 0) {
      e.sumT = 12;
      for (let i = 0; i < (ph === 1 ? 3 : 4); i++) spawn('bandit', false, e.x + 40 + i * 24);
      addText('小弟們，上！', e.x, e.y - d.h - 20, '#ffffff', 26);
    }
  } else if (d.boss === 2) {
    if (!e.patrol && e.x > 840) e.x -= d.speed * sm * dt;
    else { e.patrol = true; e.pt += dt * sm; e.x = 840 + Math.sin(e.pt * 0.5) * 170; }
    e.y = e.baseY + Math.sin(e.age * 2) * 14;
    e.atk -= dt * sm;
    if (e.atk <= 0 && e.patrol) { e.atk = ph === 1 ? 2.8 : 1.9; e.swing = 0.4; shoot(e, 'breath'); }
    if (e.sumT <= 0) {
      e.sumT = 13;
      for (let i = 0; i < 3; i++) spawn('bat', false, e.x + i * 20);
      if (ph === 2) for (let i = 0; i < 2; i++) spawn('wolf', false, W + 40 + i * 40);
    }
  } else {
    if (!e.patrol && e.x > 920) e.x -= d.speed * dt;
    else { e.patrol = true; e.pt += dt; e.x = 920 + Math.sin(e.pt * 0.4) * 90; }
    e.y = e.baseY + Math.sin(e.age * 1.6) * 14;
    if (e.mirror > 0) e.mirror -= dt;
    else if (e.patrol) {
      e.mirT -= dt;
      if (e.mirT <= 0) { e.mirror = 2.5; e.mirT = ph === 3 ? 7 : 10; addText('反射結界！', e.x, e.y - d.h - 30, '#e0d0ff', 30); SFX.shield(); }
    }
    e.atk -= dt * sm;
    if (e.atk <= 0 && e.patrol) { e.atk = ph === 1 ? 2.4 : ph === 2 ? 2.0 : 1.4; e.swing = 0.4; shoot(e, 'orb'); }
    if (e.sumT <= 0) {
      e.sumT = ph === 3 ? 12 : 15;
      const wave = ph === 1 ? ['bandit', 'bandit', 'shield'] : ph === 2 ? ['assassin', 'assassin', 'shaman'] : ['ram', 'harpy', 'harpy'];
      wave.forEach((t, i) => spawn(t, false, W + 40 + i * 50));
      addText('召喚！', e.x, e.y - d.h - 30, '#c08aff', 28);
    }
  }
}

function shoot(e, kind) {
  const d = ENEMY[e.type];
  const sx = e.x - (d.boss ? 70 : 22), sy = e.y - (d.boss === 1 ? 120 : d.boss ? 70 : 30);
  const tx = WALL_X - 10 - Math.random() * 50, ty = 420 + Math.random() * 140;
  const dmg = d.boss ? d.dmg : d.dmg * G.dmgMul;
  if (kind === 'orb') { const t = 1.6; G.shots.push({ kind, x: sx, y: sy, vx: (tx - sx) / t, vy: (ty - sy) / t, g: 0, dmg }); return; }
  const t = kind === 'arrow' ? 0.9 : 1.2, g = kind === 'breath' ? 250 : 600;
  G.shots.push({ kind, x: sx, y: sy, vx: (tx - sx) / t, vy: (ty - sy) / t - 0.5 * g * t, g, dmg });
}

function updateShots(dt) {
  for (const a of G.shots) {
    a.vy += a.g * dt; a.x += a.vx * dt; a.y += a.vy * dt;
    if (a.kind === 'breath' && Math.random() < 0.7) G.fx.push({ type: 'p', x: a.x, y: a.y, vx: 0, vy: 0, g: -80, size: 10, color: Math.random() < 0.5 ? '#ff7a3d' : '#ffe36b', life: 0.3, max: 0.3 });
    if (a.x <= WALL_X) {
      a.done = true; hitCastle(a.dmg);
      if (a.kind !== 'arrow') { burst(WALL_X, a.y, 10, a.kind === 'orb' ? ['#9a5aff', '#e0d0ff'] : ['#ff7a3d', '#ffe36b', '#3a3550'], 220, 300, 7, 0.5); SFX.blast(); }
    }
  }
  G.shots = G.shots.filter(a => !a.done);
}

function updateMagic(dt) {
  // 火球
  for (const p of G.projs) {
    const dx = p.tx - p.x, dy = p.ty - p.y, dist = Math.hypot(dx, dy), step = 1400 * dt;
    if (dist <= step) { p.done = true; explode(p.tx, p.ty, p.R, p.dmg, false); }
    else { p.x += dx / dist * step; p.y += dy / dist * step; }
    if (G.fx.length < 380) G.fx.push({ type: 'p', x: p.x, y: p.y, vx: (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 40, g: -60, size: 6, color: Math.random() < 0.5 ? '#ffb03d' : '#ffe36b', life: 0.25, max: 0.25 });
  }
  G.projs = G.projs.filter(p => !p.done);
  // 冰刺
  for (const s of G.spikes) {
    s.delay -= dt;
    if (s.delay > 0) continue;
    s.done = true;
    G.fx.push({ type: 'spike', x: s.x, y: 618, life: 0.6, max: 0.6 });
    for (const e of G.enemies) {
      if (e.dead || ENEMY[e.type].air || s.hit.has(e.id) || Math.abs(e.x - s.x) > 30) continue;
      s.hit.add(e.id); damage(e, s.dmg, 'ice'); e.slow = Math.max(e.slow, s.slowT);
    }
  }
  G.spikes = G.spikes.filter(s => !s.done);
  // 隕石
  for (const m of G.meteors) {
    if (m.delay > 0) { m.delay -= dt; continue; }
    m.t += dt;
    if (m.t >= 0.5) { m.done = true; explode(m.tx, 600, 60, m.dmg, true); }
  }
  G.meteors = G.meteors.filter(m => !m.done);
  // 火焰牆、雷暴雲
  for (const z of G.zones) {
    z.t -= dt;
    if (z.kind === 'flame') {
      z.tick -= dt;
      if (z.tick <= 0) {
        z.tick = 0.25;
        for (const e of G.enemies) if (!e.dead && !ENEMY[e.type].air && Math.abs(e.x - z.x) < 75) damage(e, z.dps * 0.25, 'flame');
      }
    } else {
      z.timer -= dt;
      if (z.timer <= 0) {
        z.timer = z.iv;
        let best = null, bd = 260;
        for (const e of G.enemies) { if (e.dead || e.stealth) continue; const dd = Math.abs(e.x - z.x); if (dd < bd) { bd = dd; best = e; } }
        if (best) {
          damage(best, z.dmg, 'bolt'); if (!best.dead) applyStun(best, 0.3);

function updateFx(dt) {
  for (const f of G.fx) {
    f.life -= dt;
    if (f.type === 'p' || f.type === 'fstar') { f.vy += (f.g || 0) * dt; f.x += f.vx * dt; f.y += f.vy * dt; }

    else if (f.type === 'coin') {

function finish(win) {
  G.over = win ? 'win' : 'lose'; G.overT = 0; P.down = false;
  const res = { gold: G.gold, bonus: 0, levelUp: null, learned: [], equipped: [], newSlot: false, spGain: 0 };
  if (win) {
    const ratio = G.castleHp / G.castleMax;
    G.stars = ratio >= 0.8 ? 3 : ratio >= 0.45 ? 2 : 1;
    const from = heroLv(), spBefore = spInfo().total, slotsBefore = slotsFor(from);
    const first = G.stage > save.cleared;
    res.bonus = Math.round((20 + 5 * G.stage) * (first ? 2 : 1));
    if (first) save.cleared = G.stage;
    save.stars[G.stage] = Math.max(save.stars[G.stage] || 0, G.stars);
    const to = heroLv();
    if (to > from) {
      res.levelUp = { from, to };
      res.learned = SPELLS.filter(s => s.unlock > from && s.unlock <= to);
      res.newSlot = slotsFor(to) > slotsBefore;
      const before = [...save.loadout];
      normalizeLoadout(true);
      res.equipped = save.loadout.filter(id => !before.includes(id));
      SFX.levelup();
    }
    res.spGain = spInfo().total - spBefore;
    SFX.win();
    if (STORY['post' + G.stage] && !save.seen['post' + G.stage]) G.postStory = 'post' + G.stage;
    const colors = ['#ff8fb8', '#ffd84d', '#7be35a', '#62cfff', '#a98bff'];
    for (let i = 0; i < 90; i++) G.fx.push({ type: 'conf', x: Math.random() * W, y: -20 - Math.random() * 320, vx: (Math.random() - 0.5) * 80,

  save.gold += res.gold + res.bonus;
  writeSave();
  G.result = res;
}

function jagged(pts) {
  const out = [pts[0]];

    const a = pts[i - 1], b = pts[i];
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
    const seg = Math.max(3, Math.floor(len / 40));
    for (let k = 1; k < seg; k++) { const off = (Math.random() - 0.5) * 26; out.push({ x: a.x + dx * k / seg + nx * off, y: a.y + dy * k / seg + ny * off }); }
    out.push(b);
  }
  return out;
}

        break;
      }
      case 'shard': { const p = 1 - a; drawSpellIcon('ice', f.x0 + (f.x1 - f.x0) * p, f.y0 + (f.y1 - f.y0) * p, 0.6); break; }
      case 'bolt': {

        ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.globalAlpha = a;
        ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));

function goFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req || document.fullscreenElement) return;
  try {
    const p = req.call(el);
    if (p && p.then) p.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {});
  } catch (e) {}
}

  txt(s.type === 'ult' ? '每關限用一次' : `魔力 ${s.cost}　冷卻 ${s.cd} 秒`, 812, 240, 20, '#7a6a8a', 'left');
  let yy = wrapText(s.desc, 812, 276, 356, 28, 19, OUT);
  yy = wrapText('升級效果：' + s.up, 812, yy + 6, 356, 28, 19, '#c98a00');
  if (un) {
    txt(`等級 ${rk} / ${MAX_RANK}`, 812, 452, 20, OUT, 'left');
    for (let k = 0; k < MAX_RANK; k++) drawStar(950 + k * 26, 452, 10, k < rk ? '#ffd84d' : '#e0d6e8', OUT, 2);
    const canUp = rk < MAX_RANK && sp.free > 0;
    button(808, 494, 180, 58, rk >= MAX_RANK ? '已滿級' : '升級（1點）', () => { save.ranks[s.id] = rk + 1; writeSave(); SFX.buy(); }, { size: 21, color: '#ffb84d', disabled: !canUp });
    if (s.type !== 'ult') {
      const eq = save.loadout.includes(s.id);
      button(1000, 494, 172, 58, eq ? '卸下' : '裝備', () => {
        if (eq) { if (save.loadout.length <= 1) { showToast('至少要帶一個魔法'); return; } save.loadout = save.loadout.filter(id => id !== s.id); }
        else { if (save.loadout.length >= slots) { showToast(`出戰欄位已滿（${slots} 格），請先卸下一個`); return; } save.loadout.push(s.id); }
        writeSave();
      }, { size: 22, color: eq ? '#b9aec8' : '#7be35a' });
    }
  } else txt(`Lv.${s.unlock} 時自動學會`, 812, 470, 22, '#9a8fae', 'left');
  // 出戰欄
  txt(`出戰魔法（${save.loadout.length} / ${slots}）`, 90, 626, 22, OUT, 'left');
  for (let i = 0; i < slots; i++) {
    const x = 340 + i * 70, id = save.loadout[i];
    circ(x, 626, 27);
    if (id) { fillStroke('#efe4ff', 3); drawSpellIcon(id, x, 626, 0.8); }
    else { ctx.setLineDash([5, 5]); ctx.lineWidth = 3; ctx.strokeStyle = '#b9aec8'; ctx.stroke(); ctx.setLineDash([]); }
  }
  txt('Lv6、Lv14 會各增加一格', 720, 626, 18, '#9a8fae', 'left');
  drawToast();
}

function renderShop() {
  drawBg(0); panel();
  txt('城堡工坊', 90, 72, 40, '#ff8a3d', 'left');
  rrect(290, 52, 200, 42, 21); fillStroke('#fff3c0', 3);
  drawCoin(316, 73, 13); txt(String(save.gold), 338, 74, 22, OUT, 'left');
  button(1010, 46, 180, 50, '返回', () => { goState('select'); }, { size: 24, color: '#ff8fb8' });
  UPGRADES.forEach((u, i) => {
    const y = 116 + i * 106, lv = save.upgrades[u.id];
    rrect(80, y, 1120, 94, 20); fillStroke('#ffffff', 3);
    drawUpgradeIcon(u.id, 136, y + 48);
    txt(u.name, 190, y + 30, 26, OUT, 'left');
    for (let k = 0; k < u.max; k++) { rrect(190 + k * 24, y + 56, 18, 14, 4); ctx.fillStyle = k < lv ? '#ffb84d' : '#e3d6ec'; ctx.fill(); }
    txt(lv ? '目前：' + u.desc(lv) : (u.id === 'owl' ? '雇用貓頭鷹咕咕，自動射出魔法羽毛' : '尚未強化'), 470, y + 32, 19, OUT, 'left');
    if (lv < u.max) txt('下一級：' + u.desc(lv + 1), 470, y + 64, 19, '#c98a00', 'left');
    if (lv < u.max) {
      const cost = upgradeCost(u, lv), ok = save.gold >= cost;
      button(1000, y + 18, 180, 58, `${cost} 金幣`, () => {
        save.gold -= cost; save.upgrades[u.id]++; writeSave(); SFX.buy();
      }, { size: 22, color: '#7be35a', disabled: !ok });
    } else button(1000, y + 18, 180, 58, '已滿級', () => {}, { size: 22, disabled: true });
  });
  drawToast();
}

// ============================================================
//  輸入
// ============================================================
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  const p = toLogical(e);
  P.x = p.x; P.y = p.y; P.mouse = e.pointerType === 'mouse';
  for (let i = buttons.length - 1; i >= 0; i--) {
    const b = buttons[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { SFX.click(); b.fn(); return; }
  }
  if (state === 'story') { advanceStory(); return; }
  if (state === 'play' && G && !G.paused && !G.over && !inHud(p.x, p.y)) {
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    P.down = true; P.onField = true;
    useSpell(G.sel, p.x, p.y, false);
  }
});
cv.addEventListener('pointermove', e => {
  const p = toLogical(e);
  P.x = p.x; P.y = p.y; P.mouse = e.pointerType === 'mouse';
  if (P.down && G) P.onField = !inHud(p.x, p.y);
});
const release = () => { P.down = false; P.onField = false; };
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { P.x = -1; release(); } });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (state === 'story') { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); advanceStory(); } return; }
  if (state !== 'play' || !G || G.over) return;
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { G.paused = !G.paused; return; }
  if (G.paused) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 5 && G.loadout[n - 1]) pressSpell(G.loadout[n - 1]);
  if (e.key === 'q' || e.key === 'Q' || e.key === ' ') { e.preventDefault(); useSpell('starfall', null, null, false); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play' && G && !G.over) G.paused = true; });

// ============================================================
//  主迴圈
// ============================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  if (isTouch && window.innerHeight > window.innerWidth && state === 'play' && G && !G.over) G.paused = true;
  buttons = [];
  if (state === 'story' && !story) goState('select');
  if (state === 'play') update(dt);
  else if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; }
  if (state === 'story') story.shown += dt * 30;
  setMusic(state === 'story' ? story.sc.music
    : state === 'play' ? (G.over ? null : G.boss ? 'boss' : ['grass', 'snow', 'volcano'][G.ch])
    : 'title');
  ctx.setTransform(K, 0, 0, K, 0, 0);
  if (state === 'title') renderTitle();
  else if (state === 'select') renderSelect();
  else if (state === 'book') renderBook();
  else if (state === 'shop') renderShop();
  else if (state === 'story') renderStory();
  else renderPlay();
  if (transT > 0) { ctx.fillStyle = `rgba(42,31,61,${transT / 0.35})`; ctx.fillRect(0, 0, W, H); transT -= dt; }
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
initCloud();

// 除錯／自動測試用
window.__wtd = { startLevel, enterLevel, playStory, update, useSpell, spawn, go: s => { state = s; }, get story() { return story; }, Music, get G() { return G; }, get save() { return save; }, set save(v) { save = v; },
  normalizeLoadout, spInfo, heroLv, upgradeCost, SPELLS, SPELL, ENEMY, LEVELS, BAL, UPGRADES };
})();
</script>
